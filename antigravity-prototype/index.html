<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ANTIGRAVITY — Resonant Orbit</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #06070a;
    color: #f2f5fa;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }

  #canvas-container {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 1;
  }

  /* 浮遊するHUD */
  .hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: calc(22px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));
  }

  .hud-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .brand-glyph {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.35em;
    color: rgba(242, 245, 250, 0.45);
    text-transform: uppercase;
  }

  .system-state {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: rgba(140, 190, 255, 0.85);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.06);
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .system-state::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #5ea4ff;
    box-shadow: 0 0 8px #5ea4ff;
    animation: pulse 2s infinite ease-in-out;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  .hud-bottom {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-align: center;
  }

  .active-node-title {
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 0.25em;
    color: #ffffff;
    min-height: 30px;
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    transition: color 0.4s;
  }

  .field-guide {
    font-size: 12px;
    letter-spacing: 0.16em;
    color: rgba(242, 245, 250, 0.65);
    font-weight: 400;
  }

  /* 没入ダイブ時の光波エフェクト */
  #warp {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 20;
    background: radial-gradient(circle at center, transparent 0%, #06070a 100%);
    opacity: 0;
    transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div class="hud">
  <div class="hud-top">
    <div class="brand-glyph">ANTIGRAVITY // 4 OBJECTS</div>
    <div class="system-state" id="sysState">ZERO-G RESONANCE</div>
  </div>
  <div class="hud-bottom">
    <div class="active-node-title" id="nodeTitle">...</div>
    <div class="field-guide" id="fieldGuide">空間をスワイプして回す · 3Dオブジェクトをタップして作品へ</div>
  </div>
</div>

<div id="warp"></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const container = document.getElementById('canvas-container');
const sysState = document.getElementById('sysState');
const nodeTitle = document.getElementById('nodeTitle');
const fieldGuide = document.getElementById('fieldGuide');
const warp = document.getElementById('warp');

// 1. Scene, Camera, Renderer
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x06070a, 0.0015);

const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.set(0, 20, 220);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
container.appendChild(renderer.domElement);

// 2. Lights
const ambientLight = new THREE.AmbientLight(0xffffff, 1.8);
scene.add(ambientLight);

const dirLight1 = new THREE.DirectionalLight(0xffffff, 2.8);
dirLight1.position.set(80, 120, 140);
scene.add(dirLight1);

const dirLight2 = new THREE.DirectionalLight(0x88bbff, 2.0);
dirLight2.position.set(-100, -80, -100);
scene.add(dirLight2);

// 3. 背景の微細なスターダスト（余計な球体は一切入れず、微細な塵のみ）
const dustCount = 350;
const dustGeo = new THREE.BufferGeometry();
const dustPositions = new Float32Array(dustCount * 3);
for(let i = 0; i < dustCount * 3; i += 3) {
  dustPositions[i] = (Math.random() - 0.5) * 750;
  dustPositions[i+1] = (Math.random() - 0.5) * 750;
  dustPositions[i+2] = (Math.random() - 0.5) * 750;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
const dustMat = new THREE.PointsMaterial({ size: 1.4, color: 0x88b5ff, transparent: true, opacity: 0.45 });
const dustParticles = new THREE.Points(dustGeo, dustMat);
scene.add(dustParticles);

// 4. 天体群グループ（公転軌道）
const orbitGroup = new THREE.Group();
scene.add(orbitGroup);

// 4つのGLBモデル定義
const modelsConfig = [
  {
    id: 'COLOR',
    name: '01 NAIL POLISH',
    file: 'assets/bottle.glb',
    orbit: 65,
    height: 24,
    speed: 0.0008,
    angle: 0,
    color: '#ff4864'
  },
  {
    id: 'SURFACE',
    name: '02 FRIENTIRIP',
    file: 'assets/frientirip.glb',
    orbit: 85,
    height: 26,
    speed: -0.00065,
    angle: Math.PI * 0.5,
    color: '#e5b452'
  },
  {
    id: 'HAND',
    name: '05 WIREFRAME HAND',
    file: 'assets/hand.glb',
    orbit: 105,
    height: 28,
    speed: 0.0005,
    angle: Math.PI,
    color: '#34d399'
  },
  {
    id: 'SPACE',
    name: '07 JISAKU HAND',
    file: 'assets/jisakuhand.glb',
    orbit: 125,
    height: 30,
    speed: -0.0004,
    angle: Math.PI * 1.5,
    color: '#60a5fa'
  }
];

// 3Dモデル正規化（原点中心化＆統一スケール）
function normalizeModel(model, targetHeight) {
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  model.position.sub(center);
  const maxDim = Math.max(size.x, size.y, size.z);
  const scale = targetHeight / (maxDim || 1);
  model.scale.set(scale, scale, scale);
  const wrapper = new THREE.Group();
  wrapper.add(model);
  return wrapper;
}

const celestialObjects = [];
const loader = new GLTFLoader();
let loadedModels = 0;

modelsConfig.forEach(config => {
  const pivot = new THREE.Group();
  orbitGroup.add(pivot);

  // タップ判定用不可視ヒットボックス
  const hitGeo = new THREE.BoxGeometry(26, 26, 26);
  const hitMat = new THREE.MeshBasicMaterial({ visible: false });
  const hitMesh = new THREE.Mesh(hitGeo, hitMat);
  hitMesh.userData = { parentConfig: config };
  pivot.add(hitMesh);

  // モデルの読み込み
  loader.load(
    config.file,
    gltf => {
      const visual = normalizeModel(gltf.scene, config.height);
      pivot.add(visual);

      celestialObjects.push({
        config: config,
        pivot: pivot,
        visual: visual,
        hitMesh: hitMesh,
        angle: config.angle,
        orbit: config.orbit,
        speed: config.speed
      });

      loadedModels++;
      sysState.textContent = `LOADED ${loadedModels}/4`;
      if (loadedModels === 4) {
        sysState.textContent = '4 OBJECTS ACTIVE';
      }
    },
    undefined,
    error => {
      console.warn('Failed loading GLB:', config.file, error);
    }
  );
});

// 5. タッチ＆慣性インタラクション（ゆったり滑らかな回転速度）
let isDragging = false;
let startX = 0, startY = 0;
let prevX = 0, prevY = 0;
let rotVelX = 0, rotVelY = 0.0004; // 初期回転も極めてゆったり
let hasMoved = false;
let diving = false;

window.addEventListener('pointerdown', e => {
  isDragging = true;
  hasMoved = false;
  startX = e.clientX;
  startY = e.clientY;
  prevX = e.clientX;
  prevY = e.clientY;
  rotVelX = 0;
  rotVelY = 0;
});

window.addEventListener('pointermove', e => {
  if (!isDragging) return;
  const dx = e.clientX - prevX;
  const dy = e.clientY - prevY;
  if (Math.hypot(e.clientX - startX, e.clientY - startY) > 8) {
    hasMoved = true;
  }
  prevX = e.clientX;
  prevY = e.clientY;

  // 移動感度を以前の約半分（ゆったり重厚に回る）
  rotVelY = dx * 0.0018;
  rotVelX = dy * 0.0018;
  orbitGroup.rotation.y += rotVelY;
  orbitGroup.rotation.x += rotVelX;
});

window.addEventListener('pointerup', e => {
  isDragging = false;
  if (!hasMoved && !diving) {
    handleClick(e.clientX, e.clientY);
  }
});

// タップによる作品ページ遷移
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function handleClick(clientX, clientY) {
  mouse.x = (clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const hitMeshes = celestialObjects.map(obj => obj.hitMesh);
  const intersects = raycaster.intersectObjects(hitMeshes);

  if (intersects.length > 0) {
    const targetConfig = intersects[0].object.userData.parentConfig;
    if (targetConfig) {
      diveIntoWork(targetConfig);
    }
  }
}

function diveIntoWork(config) {
  diving = true;
  sysState.textContent = `WARP // ${config.id}`;
  nodeTitle.textContent = config.name;
  nodeTitle.style.color = config.color;
  fieldGuide.textContent = '作品世界へダイブ中...';
  warp.style.opacity = '1';

  setTimeout(() => {
    // 該当する作品ページへダイブ
    window.location.href = `../experience-prototype/?work=${config.id}&v=antigravity`;
  }, 680);
}

// リサイズ対応
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// 6. アニメーションループ（極めてゆったりとした浮遊公転・自転）
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();
  const time = clock.getElapsedTime();

  // 慣性自転（極めてゆっくり）
  if (!isDragging) {
    rotVelY *= 0.975;
    rotVelX *= 0.975;
    if (Math.abs(rotVelY) < 0.0003) rotVelY = 0.0003; // ゆったりとした自転
    orbitGroup.rotation.y += rotVelY;
    orbitGroup.rotation.x += rotVelX;
  }

  // 上下の傾き安定リミット
  orbitGroup.rotation.x = Math.max(-0.5, Math.min(0.5, orbitGroup.rotation.x));

  // 背景微粒子のゆったりとした流れ
  dustParticles.rotation.y = time * 0.005;

  // 4つのGLBモデルの公転・自転
  let closestObj = null;
  let maxZ = -Infinity;

  celestialObjects.forEach(obj => {
    obj.angle += obj.speed;

    const ox = Math.cos(obj.angle) * obj.orbit;
    const oz = Math.sin(obj.angle) * obj.orbit;
    const oy = Math.sin(obj.angle * 1.5) * 8; // ゆるやかな上下浮遊波

    obj.pivot.position.set(ox, oy, oz);
    // 各モデルの自転もゆったり優雅に
    obj.visual.rotation.y += 0.004;
    obj.visual.rotation.x += 0.002;

    // 手前のオブジェクト判定
    const worldPos = new THREE.Vector3();
    obj.pivot.getWorldPosition(worldPos);
    worldPos.applyMatrix4(camera.matrixWorldInverse);

    if (worldPos.z > maxZ) {
      maxZ = worldPos.z;
      closestObj = obj;
    }
  });

  if (closestObj && !diving) {
    nodeTitle.textContent = closestObj.config.name;
    nodeTitle.style.color = closestObj.config.color;
  }

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
