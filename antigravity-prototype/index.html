<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ANTIGRAVITY — Resonant Orbit</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050608;
    color: #f2f5fa;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }

  #canvas-container {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 1;
  }

  /* 浮遊するHUD */
  .hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: calc(20px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
  }

  .hud-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .brand-glyph {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.35em;
    color: rgba(242, 245, 250, 0.45);
    text-transform: uppercase;
  }

  .system-state {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: rgba(140, 190, 255, 0.85);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.05);
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .system-state::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #5ea4ff;
    box-shadow: 0 0 8px #5ea4ff;
    animation: pulse 2s infinite ease-in-out;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  .hud-bottom {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-align: center;
  }

  .active-node-title {
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 0.25em;
    color: #ffffff;
    min-height: 30px;
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.45);
    transition: color 0.3s;
  }

  .field-guide {
    font-size: 12px;
    letter-spacing: 0.16em;
    color: rgba(242, 245, 250, 0.65);
    font-weight: 400;
  }

  /* 没入ダイブ時の光波エフェクト */
  #warp {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 20;
    background: radial-gradient(circle at center, transparent 0%, #050608 100%);
    opacity: 0;
    transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div class="hud">
  <div class="hud-top">
    <div class="brand-glyph">ANTIGRAVITY // 3D OBJECTS</div>
    <div class="system-state" id="sysState">ZERO-G FIELD</div>
  </div>
  <div class="hud-bottom">
    <div class="active-node-title" id="nodeTitle">...</div>
    <div class="field-guide" id="fieldGuide">空間をスワイプして回す · 3Dオブジェクトをタップして作品へ</div>
  </div>
</div>

<div id="warp"></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const container = document.getElementById('canvas-container');
const sysState = document.getElementById('sysState');
const nodeTitle = document.getElementById('nodeTitle');
const fieldGuide = document.getElementById('fieldGuide');
const warp = document.getElementById('warp');

// 1. Scene, Camera, Renderer
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050608, 0.0016);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.set(0, 25, 230);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
container.appendChild(renderer.domElement);

// 2. Lights
const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
scene.add(ambientLight);

const dirLight1 = new THREE.DirectionalLight(0xffffff, 2.5);
dirLight1.position.set(60, 100, 120);
scene.add(dirLight1);

const dirLight2 = new THREE.DirectionalLight(0x88bbff, 1.8);
dirLight2.position.set(-80, -60, -80);
scene.add(dirLight2);

// 3. Central Core: 呼吸する光核
const coreGeo = new THREE.SphereGeometry(3.2, 32, 32);
const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const coreMesh = new THREE.Mesh(coreGeo, coreMat);
scene.add(coreMesh);

const ringGeo = new THREE.RingGeometry(5.5, 5.9, 64);
const ringMat = new THREE.MeshBasicMaterial({ color: 0x5ea4ff, side: THREE.DoubleSide, transparent: true, opacity: 0.35 });
const ringMesh = new THREE.Mesh(ringGeo, ringMat);
ringMesh.rotation.x = Math.PI / 2;
scene.add(ringMesh);

// 4. 背景浮遊スターダスト
const dustCount = 400;
const dustGeo = new THREE.BufferGeometry();
const dustPositions = new Float32Array(dustCount * 3);
for(let i = 0; i < dustCount * 3; i += 3) {
  dustPositions[i] = (Math.random() - 0.5) * 800;
  dustPositions[i+1] = (Math.random() - 0.5) * 800;
  dustPositions[i+2] = (Math.random() - 0.5) * 800;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
const dustMat = new THREE.PointsMaterial({ size: 1.5, color: 0xa8ccff, transparent: true, opacity: 0.6 });
const dustParticles = new THREE.Points(dustGeo, dustMat);
scene.add(dustParticles);

// 5. 天体群グループ（公転軌道）
const orbitGroup = new THREE.Group();
scene.add(orbitGroup);

// 10の作品世界データ
const worksData = [
  { id: 'COLOR',    name: '01 COLOR',    color: 0xff3b56, orbit: 60,  speed: 0.0055, angle: 0.2 },
  { id: 'SURFACE',  name: '02 SURFACE',  color: 0xe5b452, orbit: 85,  speed: -0.0042, angle: 1.1 },
  { id: 'SCULPT',   name: '03 SCULPT',   color: 0x34d399, orbit: 115, speed: 0.0035, angle: 2.0 },
  { id: 'LIGHT',    name: '04 LIGHT',    color: 0x60a5fa, orbit: 75,  speed: -0.0048, angle: 2.9 },
  { id: 'HAND',     name: '05 HAND',     color: 0xf472b6, orbit: 135, speed: 0.0028, angle: 3.7 },
  { id: 'TRACE',    name: '06 TRACE',    color: 0xa78bfa, orbit: 50,  speed: -0.0065, angle: 4.4 },
  { id: 'SPACE',    name: '07 SPACE',    color: 0x38bdf8, orbit: 155, speed: 0.0022, angle: 5.1 },
  { id: 'THINKING', name: '08 THINKING', color: 0xc084fc, orbit: 100, speed: -0.0038, angle: 1.6 },
  { id: 'ORB',      name: '09 ORB',      color: 0xf8fafc, orbit: 125, speed: 0.0031, angle: 2.5 },
  { id: 'FRAME',    name: '10 FRAME',    color: 0xfb923c, orbit: 70,  speed: -0.0052, angle: 5.8 }
];

const celestialObjects = [];

// 軌道リングの描画（微かな重力ライン）
[50, 75, 100, 125, 155].forEach(r => {
  const lineGeo = new THREE.BufferGeometry();
  const points = [];
  for (let i = 0; i <= 64; i++) {
    const theta = (i / 64) * Math.PI * 2;
    points.push(new THREE.Vector3(Math.cos(theta) * r, 0, Math.sin(theta) * r));
  }
  lineGeo.setFromPoints(points);
  const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.05 });
  const orbitLine = new THREE.Line(lineGeo, lineMat);
  orbitGroup.add(orbitLine);
});

// GLTFローダーでボトル・ハンドのGLBモデルを読み込み
const loader = new GLTFLoader();
let bottleMeshGroup = null;
let handMeshGroup = null;

// モデル正規化ヘルパー
function normalizeModel(model, targetHeight) {
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  model.position.sub(center); // 原点中心に移動
  const maxDim = Math.max(size.x, size.y, size.z);
  const scale = targetHeight / (maxDim || 1);
  const wrapper = new THREE.Group();
  model.scale.set(scale, scale, scale);
  wrapper.add(model);
  return wrapper;
}

// 読み込み完了後に全天体を3Dオブジェクトとして初期化
let loadedCount = 0;
function onModelReady() {
  loadedCount++;
  if (loadedCount >= 2) {
    buildScene();
  }
}

loader.load('assets/bottle.glb', gltf => {
  bottleMeshGroup = normalizeModel(gltf.scene, 18);
  onModelReady();
}, undefined, () => onModelReady());

loader.load('assets/hand.glb', gltf => {
  handMeshGroup = normalizeModel(gltf.scene, 22);
  onModelReady();
}, undefined, () => onModelReady());

// 万が一GLBロードに時間がかかった場合のフォールバックタイマー
setTimeout(() => {
  if (celestialObjects.length === 0) buildScene();
}, 2500);

function buildScene() {
  if (celestialObjects.length > 0) return;
  sysState.textContent = '3D OBJECT ORBIT';

  worksData.forEach((data, index) => {
    const pivot = new THREE.Group();
    orbitGroup.add(pivot);

    let visual;
    // 作品ごとにGLBモデルを配置（ボトル、ハンド、幾何立体など）
    if (index % 2 === 0 && bottleMeshGroup) {
      visual = bottleMeshGroup.clone(true);
      // 色のバリエーション
      visual.traverse(child => {
        if (child.isMesh && child.material) {
          child.material = child.material.clone();
          if (child.material.color) {
            child.material.color.lerp(new THREE.Color(data.color), 0.25);
          }
        }
      });
    } else if (index % 2 === 1 && handMeshGroup) {
      visual = handMeshGroup.clone(true);
    } else {
      // 幾何学3Dオブジェクト
      const geo = (index % 3 === 0) ? new THREE.IcosahedronGeometry(7, 0)
                : (index % 3 === 1) ? new THREE.TorusGeometry(6, 2.2, 16, 32)
                : new THREE.OctahedronGeometry(7, 0);
      const mat = new THREE.MeshStandardMaterial({
        color: data.color,
        roughness: 0.2,
        metalness: 0.8,
        emissive: data.color,
        emissiveIntensity: 0.25
      });
      visual = new THREE.Mesh(geo, mat);
    }

    // タップ判定を容易にする透明ヒットボックス（半径12）
    const hitGeo = new THREE.SphereGeometry(12, 12, 12);
    const hitMat = new THREE.MeshBasicMaterial({ visible: false });
    const hitMesh = new THREE.Mesh(hitGeo, hitMat);
    hitMesh.userData = { parentData: data };
    pivot.add(hitMesh);

    // 反重力光輪（ワイヤーフレームオーラ）
    const auraGeo = new THREE.SphereGeometry(10.5, 14, 14);
    const auraMat = new THREE.MeshBasicMaterial({
      color: data.color,
      wireframe: true,
      transparent: true,
      opacity: 0.28
    });
    const auraMesh = new THREE.Mesh(auraGeo, auraMat);
    pivot.add(auraMesh);

    pivot.add(visual);

    celestialObjects.push({
      data: data,
      pivot: pivot,
      visual: visual,
      aura: auraMesh,
      hitMesh: hitMesh,
      angle: data.angle,
      orbit: data.orbit,
      speed: data.speed
    });
  });
}

// 6. タッチ＆慣性インタラクション
let isDragging = false;
let startX = 0, startY = 0;
let prevX = 0, prevY = 0;
let rotVelX = 0, rotVelY = 0.0016;
let hasMoved = false;
let diving = false;

window.addEventListener('pointerdown', e => {
  isDragging = true;
  hasMoved = false;
  startX = e.clientX;
  startY = e.clientY;
  prevX = e.clientX;
  prevY = e.clientY;
  rotVelX = 0;
  rotVelY = 0;
});

window.addEventListener('pointermove', e => {
  if (!isDragging) return;
  const dx = e.clientX - prevX;
  const dy = e.clientY - prevY;
  if (Math.hypot(e.clientX - startX, e.clientY - startY) > 8) {
    hasMoved = true;
  }
  prevX = e.clientX;
  prevY = e.clientY;

  rotVelY = dx * 0.0038;
  rotVelX = dy * 0.0038;
  orbitGroup.rotation.y += rotVelY;
  orbitGroup.rotation.x += rotVelX;
});

window.addEventListener('pointerup', e => {
  isDragging = false;
  // ドラッグではなくタップだった場合
  if (!hasMoved && !diving) {
    handleClick(e.clientX, e.clientY);
  }
});

// タップによる作品ページ遷移（Raycaster）
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function handleClick(clientX, clientY) {
  mouse.x = (clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const hitMeshes = celestialObjects.map(obj => obj.hitMesh);
  const intersects = raycaster.intersectObjects(hitMeshes);

  if (intersects.length > 0) {
    const targetData = intersects[0].object.userData.parentData;
    if (targetData) {
      diveIntoWork(targetData);
    }
  }
}

function diveIntoWork(data) {
  diving = true;
  sysState.textContent = `WARP // ${data.id}`;
  nodeTitle.textContent = data.name;
  nodeTitle.style.color = `#${data.color.toString(16).padStart(6, '0')}`;
  fieldGuide.textContent = '作品世界へダイブ中...';
  warp.style.opacity = '1';

  setTimeout(() => {
    // experience-prototypeの作品ページへ遷移
    window.location.href = `../experience-prototype/?work=${data.id}&v=antigravity`;
  }, 680);
}

// リサイズ対応
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// 7. アニメーションループ
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();
  const time = clock.getElapsedTime();

  // 慣性自転
  if (!isDragging) {
    rotVelY *= 0.96;
    rotVelX *= 0.96;
    if (Math.abs(rotVelY) < 0.001) rotVelY = 0.0012; // 永久浮遊回転
    orbitGroup.rotation.y += rotVelY;
    orbitGroup.rotation.x += rotVelX;
  }

  // 上下の傾き安定リミット
  orbitGroup.rotation.x = Math.max(-0.6, Math.min(0.6, orbitGroup.rotation.x));

  // 背景ダストの回転
  dustParticles.rotation.y = time * 0.018;

  // コアの呼吸
  const coreScale = 1 + Math.sin(time * 2.8) * 0.16;
  coreMesh.scale.set(coreScale, coreScale, coreScale);
  ringMesh.rotation.z = time * 0.35;

  // 各天体の軌道公転・自転
  let closestObj = null;
  let maxZ = -Infinity;

  celestialObjects.forEach(obj => {
    obj.angle += obj.speed;

    const ox = Math.cos(obj.angle) * obj.orbit;
    const oz = Math.sin(obj.angle) * obj.orbit;
    const oy = Math.sin(obj.angle * 2.2) * 10;

    obj.pivot.position.set(ox, oy, oz);
    obj.visual.rotation.y += 0.016;
    obj.visual.rotation.x += 0.009;
    obj.aura.rotation.z = time * 0.8;

    // カメラ視点での最も手前にある天体を判定
    const worldPos = new THREE.Vector3();
    obj.pivot.getWorldPosition(worldPos);
    worldPos.applyMatrix4(camera.matrixWorldInverse);

    if (worldPos.z > maxZ) {
      maxZ = worldPos.z;
      closestObj = obj;
    }
  });

  if (closestObj && !diving) {
    nodeTitle.textContent = closestObj.data.name;
    nodeTitle.style.color = `#${closestObj.data.color.toString(16).padStart(6, '0')}`;
  }

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
