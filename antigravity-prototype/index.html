<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ANTIGRAVITY — Resonant 3D</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: fixed;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-overflow-scrolling: auto;
    background: #07080c;
    color: #f2f5fa;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
  }

  #canvas-container {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 1;
    touch-action: none;
  }

  /* 画面上部：ミニマルなタイトル */
  .header-ui {
    position: fixed;
    top: calc(18px + env(safe-area-inset-top));
    left: 0;
    right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 10;
  }

  .header-main {
    font-size: 17px;
    font-weight: 300;
    letter-spacing: 0.35em;
    color: #ffffff;
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.45);
    text-indent: 0.35em;
    margin-bottom: 5px;
  }

  .header-sub {
    font-size: 9.5px;
    font-weight: 500;
    letter-spacing: 0.32em;
    color: rgba(242, 245, 250, 0.45);
    text-transform: uppercase;
    text-indent: 0.32em;
  }

  /* 画面下部：案内文 */
  .footer-ui {
    position: fixed;
    bottom: calc(24px + env(safe-area-inset-bottom));
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-align: center;
    pointer-events: none;
    z-index: 10;
  }

  .active-title {
    font-size: 20px;
    font-weight: 400;
    letter-spacing: 0.2em;
    color: #ffffff;
    min-height: 26px;
    text-shadow: 0 0 24px rgba(255, 255, 255, 0.5);
    transition: color 0.3s;
  }

  .action-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.16);
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 12px;
    letter-spacing: 0.12em;
    color: rgba(255, 255, 255, 0.85);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
  }
  .action-pill::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #d4a748;
    box-shadow: 0 0 8px #d4a748;
  }

  /* 画面遷移時の暗転・光波ヴェール */
  #veil {
    position: fixed;
    inset: 0;
    background: #07080c;
    opacity: 0;
    pointer-events: none;
    z-index: 100;
    transition: opacity 0.5s ease;
  }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div class="header-ui">
  <div class="header-main">TOUCH HANDS</div>
  <div class="header-sub">HAND &amp; LIGHT ATELIER</div>
</div>

<div class="footer-ui">
  <div class="active-title" id="activeTitle">読み込み中...</div>
  <div class="action-pill">触れて、作品へ進む</div>
</div>

<div id="veil"></div>

<script>
// ピンチズーム・ダブルタップズームを完全遮断
document.addEventListener('touchstart', function(e) {
  if (e.touches.length > 1) {
    e.preventDefault();
  }
}, { passive: false });

document.addEventListener('touchmove', function(e) {
  if (e.touches.length > 1) {
    e.preventDefault();
  }
}, { passive: false });

let lastTouchEnd = 0;
document.addEventListener('touchend', function(e) {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) {
    e.preventDefault();
  }
  lastTouchEnd = now;
}, { passive: false });

document.addEventListener('gesturestart', function(e) {
  e.preventDefault();
});
document.addEventListener('gesturechange', function(e) {
  e.preventDefault();
});
document.addEventListener('gestureend', function(e) {
  e.preventDefault();
});
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const container = document.getElementById('canvas-container');
const activeTitleEl = document.getElementById('activeTitle');
const veil = document.getElementById('veil');

// 1. Scene, Camera, Renderer
const scene = new THREE.Scene();

// スマホ画面の画角に合わせて調整
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 105);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
container.appendChild(renderer.domElement);

// 2. Lights
const ambientLight = new THREE.AmbientLight(0xffffff, 2.0);
scene.add(ambientLight);

const dirLight1 = new THREE.DirectionalLight(0xffffff, 2.8);
dirLight1.position.set(60, 100, 100);
scene.add(dirLight1);

const dirLight2 = new THREE.DirectionalLight(0xa5c8ff, 1.8);
dirLight2.position.set(-60, -80, -60);
scene.add(dirLight2);

// 3. 背景微小ダスト
const dustCount = 280;
const dustGeo = new THREE.BufferGeometry();
const dustPositions = new Float32Array(dustCount * 3);
for (let i = 0; i < dustCount * 3; i += 3) {
  dustPositions[i] = (Math.random() - 0.5) * 450;
  dustPositions[i + 1] = (Math.random() - 0.5) * 450;
  dustPositions[i + 2] = (Math.random() - 0.5) * 450;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
const dustMat = new THREE.PointsMaterial({ size: 1.2, color: 0x88aaff, transparent: true, opacity: 0.35 });
const dustMesh = new THREE.Points(dustGeo, dustMat);
scene.add(dustMesh);

// 4. 同一画面に4つのオブジェクトを同時に浮遊配置するグループ
const universeGroup = new THREE.Group();
scene.add(universeGroup);

// スマホ縦画面の中央で、4つが絶妙に収まる配置座標
// 上・右・下・左のダイヤモンド軌道で美しく浮遊
const modelsConfig = [
  {
    id: 'COLOR',
    name: '01 NAIL POLISH',
    file: 'assets/bottle.glb',
    targetSize: 25,
    pos: new THREE.Vector3(0, 26, 0),
    floatPhase: 0,
    color: '#ff4864'
  },
  {
    id: 'SURFACE',
    name: '02 FRIENTIRIP',
    file: 'assets/frientirip.glb',
    targetSize: 26,
    pos: new THREE.Vector3(22, 0, 0),
    floatPhase: Math.PI * 0.5,
    color: '#e5b452'
  },
  {
    id: 'HAND',
    name: '05 WIREFRAME HAND',
    file: 'assets/hand.glb',
    targetSize: 27,
    pos: new THREE.Vector3(0, -26, 0),
    floatPhase: Math.PI,
    color: '#34d399'
  },
  {
    id: 'SPACE',
    name: '07 JISAKU HAND',
    file: 'assets/jisakuhand.glb',
    targetSize: 28,
    pos: new THREE.Vector3(-22, 0, 0),
    floatPhase: Math.PI * 1.5,
    color: '#60a5fa'
  }
];

function prepareModel(model, targetSize) {
  model.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());

  model.position.sub(center); // 中心を原点に

  const maxDim = Math.max(size.x, size.y, size.z);
  const scale = targetSize / (maxDim || 1);
  model.scale.set(scale, scale, scale);

  const wrapper = new THREE.Group();
  wrapper.add(model);
  return wrapper;
}

const objects = [];
const loader = new GLTFLoader();
let loadedCount = 0;

modelsConfig.forEach(config => {
  const pivot = new THREE.Group();
  pivot.position.copy(config.pos);
  universeGroup.add(pivot);

  // タップ判定用の透明ヒットボックス（指で押しやすいよう大きめ）
  const hitGeo = new THREE.SphereGeometry(16, 16, 16);
  const hitMat = new THREE.MeshBasicMaterial({ visible: false });
  const hitMesh = new THREE.Mesh(hitGeo, hitMat);
  hitMesh.userData = { config: config };
  pivot.add(hitMesh);

  loader.load(
    config.file,
    gltf => {
      const visual = prepareModel(gltf.scene, config.targetSize);
      pivot.add(visual);

      objects.push({
        pivot: pivot,
        visual: visual,
        hitMesh: hitMesh,
        config: config,
        basePos: config.pos.clone(),
        phase: config.floatPhase
      });

      loadedCount++;
      if (loadedCount >= 4) {
        activeTitleEl.textContent = '4つの作品が共鳴中';
      }
    },
    undefined,
    err => console.error('Error loading:', config.file, err)
  );
});

// 5. タッチ操作：指で空間全体を撫でてゆっくり回す ＆ タップで作品へダイブ
let isDragging = false;
let startX = 0, startY = 0;
let prevX = 0, prevY = 0;
let rotVelX = 0, rotVelY = 0.0006; // 初期自転もゆったり
let hasMoved = false;
let navigating = false;

window.addEventListener('pointerdown', e => {
  if (navigating || e.isPrimary === false) return;
  isDragging = true;
  hasMoved = false;
  startX = e.clientX;
  startY = e.clientY;
  prevX = e.clientX;
  prevY = e.clientY;
  rotVelX = 0;
  rotVelY = 0;
});

window.addEventListener('pointermove', e => {
  if (!isDragging || navigating) return;
  const dx = e.clientX - prevX;
  const dy = e.clientY - prevY;
  if (Math.hypot(e.clientX - startX, e.clientY - startY) > 6) {
    hasMoved = true;
  }
  prevX = e.clientX;
  prevY = e.clientY;

  rotVelY = dx * 0.0028;
  rotVelX = dy * 0.0028;
  universeGroup.rotation.y += rotVelY;
  universeGroup.rotation.x += rotVelX;
});

window.addEventListener('pointerup', e => {
  if (!isDragging || navigating) return;
  isDragging = false;

  const totalDist = Math.hypot(e.clientX - startX, e.clientY - startY);
  if (!hasMoved || totalDist <= 6) {
    handleTap(e.clientX, e.clientY);
  }
});

// Raycasterによるタップ検知
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function handleTap(clientX, clientY) {
  mouse.x = (clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const hitMeshes = objects.map(o => o.hitMesh);
  const intersects = raycaster.intersectObjects(hitMeshes);

  if (intersects.length > 0) {
    const targetConfig = intersects[0].object.userData.config;
    if (targetConfig) {
      diveIntoWork(targetConfig);
    }
  }
}

function diveIntoWork(config) {
  if (navigating) return;
  navigating = true;
  activeTitleEl.textContent = `WARP ➔ ${config.name}`;
  activeTitleEl.style.color = config.color;
  veil.style.opacity = '1';

  setTimeout(() => {
    window.location.href = `../experience-prototype/?work=${config.id}&v=antigravity`;
  }, 480);
}

// リサイズ対応
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// 6. アニメーションループ（ゆったりとした浮遊公転・自転）
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const time = clock.getElapsedTime();

  // 空間全体のゆっくりとした慣性回転
  if (!isDragging) {
    rotVelY *= 0.98;
    rotVelX *= 0.98;
    if (Math.abs(rotVelY) < 0.0004) rotVelY = 0.0004; // 常に静かに自転
    universeGroup.rotation.y += rotVelY;
    universeGroup.rotation.x += rotVelX;
  }

  // 傾きの安定制御
  universeGroup.rotation.x = Math.max(-0.45, Math.min(0.45, universeGroup.rotation.x));

  // 背景ダストの回転
  dustMesh.rotation.y = time * 0.01;

  // 4つのオブジェクトそれぞれの自律浮遊
  let closestObj = null;
  let maxZ = -Infinity;

  objects.forEach(obj => {
    if (!obj.visual) return;

    // 各オブジェクトが上下左右にふわふわ浮遊波を打つ
    obj.pivot.position.y = obj.basePos.y + Math.sin(time * 1.5 + obj.phase) * 2.8;
    obj.pivot.position.x = obj.basePos.x + Math.cos(time * 1.2 + obj.phase) * 1.5;

    // オブジェクト自身も優雅にゆっくり自転
    obj.visual.rotation.y += 0.008;
    obj.visual.rotation.x += 0.004;

    // 最も手前にあるオブジェクトの検知
    const worldPos = new THREE.Vector3();
    obj.pivot.getWorldPosition(worldPos);
    worldPos.applyMatrix4(camera.matrixWorldInverse);

    if (worldPos.z > maxZ) {
      maxZ = worldPos.z;
      closestObj = obj;
    }
  });

  if (closestObj && !navigating && loadedCount >= 4) {
    activeTitleEl.textContent = closestObj.config.name;
    activeTitleEl.style.color = closestObj.config.color;
  }

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
