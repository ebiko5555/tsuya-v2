<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ANTIGRAVITY — Resonant Orbit</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050608;
    color: #f2f5fa;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }

  #canvas-container {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 1;
  }

  /* 浮遊するHUD */
  .hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
  }

  .hud-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .brand-glyph {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.35em;
    color: rgba(242, 245, 250, 0.45);
    text-transform: uppercase;
  }

  .system-state {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: rgba(140, 190, 255, 0.7);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .system-state::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #5ea4ff;
    box-shadow: 0 0 8px #5ea4ff;
    animation: pulse 2s infinite ease-in-out;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  .hud-bottom {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-align: center;
  }

  .field-guide {
    font-size: 11.5px;
    letter-spacing: 0.18em;
    color: rgba(242, 245, 250, 0.55);
    font-weight: 400;
  }

  .active-node-title {
    font-size: 20px;
    font-weight: 300;
    letter-spacing: 0.25em;
    color: #ffffff;
    min-height: 28px;
    text-shadow: 0 0 16px rgba(255, 255, 255, 0.35);
  }

  /* 没入ダイブ時の光波エフェクト */
  #warp {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 20;
    background: radial-gradient(circle at center, transparent 0%, #050608 100%);
    opacity: 0;
    transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div class="hud">
  <div class="hud-top">
    <div class="brand-glyph">ANTIGRAVITY // RESOUND</div>
    <div class="system-state" id="sysState">3D ORBIT RESONANCE</div>
  </div>
  <div class="hud-bottom">
    <div class="active-node-title" id="nodeTitle"></div>
    <div class="field-guide" id="fieldGuide">空間を撫でて星界を回す · 3Dオブジェに触れて作品へ</div>
  </div>
</div>

<div id="warp"></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const container = document.getElementById('canvas-container');
const sysState = document.getElementById('sysState');
const nodeTitle = document.getElementById('nodeTitle');
const fieldGuide = document.getElementById('fieldGuide');
const warp = document.getElementById('warp');

// 1. Scene, Camera, Renderer
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050608, 0.0018);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.set(0, 30, 240);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
container.appendChild(renderer.domElement);

// 2. Lights
const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xd4e4ff, 2.4);
dirLight.position.set(50, 120, 100);
scene.add(dirLight);

const pointLight = new THREE.PointLight(0xa4735c, 3.5, 350);
pointLight.position.set(0, 0, 0);
scene.add(pointLight);

// 3. Central Core: 呼吸する光核
const coreGeo = new THREE.SphereGeometry(3.5, 32, 32);
const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const coreMesh = new THREE.Mesh(coreGeo, coreMat);
scene.add(coreMesh);

// コア周辺のアンビエントリング
const ringGeo = new THREE.RingGeometry(6, 6.4, 64);
const ringMat = new THREE.MeshBasicMaterial({ color: 0x5ea4ff, side: THREE.DoubleSide, transparent: true, opacity: 0.35 });
const ringMesh = new THREE.Mesh(ringGeo, ringMat);
ringMesh.rotation.x = Math.PI / 2;
scene.add(ringMesh);

// 4. 背景浮遊スターダスト
const dustCount = 450;
const dustGeo = new THREE.BufferGeometry();
const dustPositions = new Float32Array(dustCount * 3);
for(let i = 0; i < dustCount * 3; i += 3) {
  dustPositions[i] = (Math.random() - 0.5) * 800;
  dustPositions[i+1] = (Math.random() - 0.5) * 800;
  dustPositions[i+2] = (Math.random() - 0.5) * 800;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
const dustMat = new THREE.PointsMaterial({ size: 1.6, color: 0x9ec5ff, transparent: true, opacity: 0.65 });
const dustParticles = new THREE.Points(dustGeo, dustMat);
scene.add(dustParticles);

// 5. 天体群グループ（公転軌道）
const orbitGroup = new THREE.Group();
scene.add(orbitGroup);

// 10の作品世界データ
const worksData = [
  { id: 'COLOR',    name: '01 COLOR',    color: 0xff4864, orbit: 65,  speed: 0.0055, angle: 0.3 },
  { id: 'SURFACE',  name: '02 SURFACE',  color: 0xe5b452, orbit: 95,  speed: -0.0042, angle: 1.2 },
  { id: 'SCULPT',   name: '03 SCULPT',   color: 0x34d399, orbit: 125, speed: 0.0035, angle: 2.1 },
  { id: 'LIGHT',    name: '04 LIGHT',    color: 0x60a5fa, orbit: 80,  speed: -0.0048, angle: 3.0 },
  { id: 'HAND',     name: '05 HAND',     color: 0xf472b6, orbit: 145, speed: 0.0028, angle: 3.8 },
  { id: 'TRACE',    name: '06 TRACE',    color: 0xa78bfa, orbit: 55,  speed: -0.0062, angle: 4.5 },
  { id: 'SPACE',    name: '07 SPACE',    color: 0x38bdf8, orbit: 165, speed: 0.0022, angle: 5.2 },
  { id: 'THINKING', name: '08 THINKING', color: 0xc084fc, orbit: 110, speed: -0.0038, angle: 1.8 },
  { id: 'ORB',      name: '09 ORB',      color: 0xf8fafc, orbit: 135, speed: 0.0031, angle: 2.7 },
  { id: 'FRAME',    name: '10 FRAME',    color: 0xfb923c, orbit: 72,  speed: -0.0052, angle: 5.8 }
];

// GLTFローダーでGLBモデルを読み込み
const loader = new GLTFLoader();
let bottleModelTemplate = null;
let handModelTemplate = null;

loader.load('assets/bottle.glb', gltf => {
  bottleModelTemplate = gltf.scene;
  // 適切なスケールに調整
  bottleModelTemplate.scale.set(1.4, 1.4, 1.4);
  setupCelestialObjects();
}, undefined, () => {
  setupCelestialObjects();
});

loader.load('assets/hand.glb', gltf => {
  handModelTemplate = gltf.scene;
  handModelTemplate.scale.set(0.045, 0.045, 0.045);
  // もしhandが後からロードされた場合も反映
  applyHandModel();
}, undefined, () => {});

const celestialObjects = [];

function setupCelestialObjects() {
  worksData.forEach((data, index) => {
    const pivot = new THREE.Group();
    orbitGroup.add(pivot);

    let mainVisual;
    // 奇数番目や特定ノードにGLBモデル（ボトル・手）をアサイン
    if (index === 0 && bottleModelTemplate) {
      mainVisual = bottleModelTemplate.clone();
    } else if (index % 3 === 0 && bottleModelTemplate) {
      mainVisual = bottleModelTemplate.clone();
      mainVisual.scale.set(1.2, 1.2, 1.2);
    } else if (index === 4 && handModelTemplate) {
      mainVisual = handModelTemplate.clone();
    } else {
      // 光輝く幾何学オーブ（天体核）
      const orbGeo = new THREE.SphereGeometry(4.2, 24, 24);
      const orbMat = new THREE.MeshStandardMaterial({
        color: data.color,
        roughness: 0.15,
        metalness: 0.85,
        emissive: data.color,
        emissiveIntensity: 0.4
      });
      mainVisual = new THREE.Mesh(orbGeo, orbMat);
    }

    // 周囲の微光オーラ（反重力フィールド）
    const glowGeo = new THREE.SphereGeometry(6.2, 16, 16);
    const glowMat = new THREE.MeshBasicMaterial({
      color: data.color,
      transparent: true,
      opacity: 0.28,
      wireframe: true
    });
    const glowMesh = new THREE.Mesh(glowGeo, glowMat);
    mainVisual.add(glowMesh);

    pivot.add(mainVisual);

    celestialObjects.push({
      data: data,
      pivot: pivot,
      visual: mainVisual,
      glow: glowMesh,
      angle: data.angle,
      orbit: data.orbit,
      speed: data.speed
    });
  });
}

function applyHandModel() {
  if (!handModelTemplate) return;
  // HANDノード（index: 4）をWireframe手モデルで置換
  const target = celestialObjects.find(obj => obj.data.id === 'HAND');
  if (target) {
    target.pivot.remove(target.visual);
    const newHand = handModelTemplate.clone();
    target.pivot.add(newHand);
    target.visual = newHand;
  }
}

// 6. タッチ＆慣性インタラクション
let isDragging = false;
let prevX = 0, prevY = 0;
let rotVelX = 0, rotVelY = 0.0015;
let targetRotX = 0.25, targetRotY = 0;
let diving = false;

window.addEventListener('pointerdown', e => {
  isDragging = true;
  prevX = e.clientX;
  prevY = e.clientY;
  rotVelX = 0;
  rotVelY = 0;
});

window.addEventListener('pointermove', e => {
  if (!isDragging) return;
  const dx = e.clientX - prevX;
  const dy = e.clientY - prevY;
  prevX = e.clientX;
  prevY = e.clientY;

  rotVelY = dx * 0.0035;
  rotVelX = dy * 0.0035;
  orbitGroup.rotation.y += rotVelY;
  orbitGroup.rotation.x += rotVelX;
});

window.addEventListener('pointerup', () => {
  isDragging = false;
});

// タップ検知（Raycaster）
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener('click', e => {
  if (diving) return;
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  // 天体オブジェクトのクリック判定
  const interactables = [];
  celestialObjects.forEach(obj => {
    obj.visual.traverse(child => {
      if (child.isMesh) {
        child.userData = { parentObj: obj };
        interactables.push(child);
      }
    });
  });

  const intersects = raycaster.intersectObjects(interactables);
  if (intersects.length > 0) {
    const clickedObj = intersects[0].object.userData.parentObj;
    if (clickedObj) {
      diveIntoNode(clickedObj);
    }
  }
});

function diveIntoNode(obj) {
  diving = true;
  sysState.textContent = `DIVING // ${obj.data.id}`;
  nodeTitle.textContent = obj.data.name;
  fieldGuide.textContent = '作品世界へワープ中...';
  warp.style.opacity = '1';

  // カメラを対象天体へ急接近
  const worldPos = new THREE.Vector3();
  obj.visual.getWorldPosition(worldPos);

  setTimeout(() => {
    window.location.href = `../experience-prototype/?work=${obj.data.id}&v=antigravity`;
  }, 750);
}

// リサイズ対応
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// 7. アニメーションループ
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();
  const time = clock.getElapsedTime();

  // 慣性回転
  if (!isDragging) {
    rotVelY *= 0.96;
    rotVelX *= 0.96;
    if (Math.abs(rotVelY) < 0.001) rotVelY = 0.001; // 永久自転
    orbitGroup.rotation.y += rotVelY;
    orbitGroup.rotation.x += rotVelX;
  }

  // 傾きの安定制御
  orbitGroup.rotation.x = Math.max(-0.65, Math.min(0.65, orbitGroup.rotation.x));

  // 背景ダストの浮遊
  dustParticles.rotation.y = time * 0.02;

  // コアの呼吸
  const coreScale = 1 + Math.sin(time * 2.5) * 0.18;
  coreMesh.scale.set(coreScale, coreScale, coreScale);
  ringMesh.rotation.z = time * 0.4;

  // 各天体の軌道公転・自転
  let closestObj = null;
  let maxZ = -Infinity;

  celestialObjects.forEach(obj => {
    obj.angle += obj.speed;

    const ox = Math.cos(obj.angle) * obj.orbit;
    const oz = Math.sin(obj.angle) * obj.orbit;
    const oy = Math.sin(obj.angle * 2.2) * 9;

    obj.visual.position.set(ox, oy, oz);
    obj.visual.rotation.y += 0.015;
    obj.visual.rotation.x += 0.008;

    // カメラ空間での奥行き判定
    const worldPos = new THREE.Vector3();
    obj.visual.getWorldPosition(worldPos);
    worldPos.applyMatrix4(camera.matrixWorldInverse);

    if (worldPos.z > maxZ) {
      maxZ = worldPos.z;
      closestObj = obj;
    }
  });

  if (closestObj && !diving) {
    nodeTitle.textContent = closestObj.data.name;
    nodeTitle.style.color = `#${closestObj.data.color.toString(16).padStart(6, '0')}`;
  }

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
