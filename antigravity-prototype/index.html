<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ANTIGRAVITY — Resonant 3D</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: fixed;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-overflow-scrolling: auto;
    background: #07080c;
    color: #f2f5fa;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
  }

  #canvas-container {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 1;
    touch-action: none;
  }

  /* 画面上部：ミニマルなタイトル */
  .header-ui {
    position: fixed;
    top: calc(18px + env(safe-area-inset-top));
    left: 0;
    right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 10;
  }

  .header-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.38em;
    color: rgba(242, 245, 250, 0.45);
    text-transform: uppercase;
    text-indent: 0.38em;
  }

  /* 画面下部：スワイプ案内・オブジェクト名・タップ案内 */
  .footer-ui {
    position: fixed;
    bottom: calc(24px + env(safe-area-inset-bottom));
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-align: center;
    pointer-events: none;
    z-index: 10;
  }

  .object-name {
    font-size: 20px;
    font-weight: 400;
    letter-spacing: 0.2em;
    color: #ffffff;
    min-height: 26px;
    text-shadow: 0 0 24px rgba(255, 255, 255, 0.5);
    transition: opacity 0.3s;
  }

  .action-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.16);
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 12px;
    letter-spacing: 0.12em;
    color: rgba(255, 255, 255, 0.85);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
  }
  .action-pill::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #d4a748;
    box-shadow: 0 0 8px #d4a748;
  }

  /* ページ切り替えインジケータ（4つのドット） */
  .dots {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    transition: background 0.3s, transform 0.3s;
  }
  .dot.active {
    background: #ffffff;
    transform: scale(1.3);
  }

  /* 画面遷移時の暗転・光波ヴェール */
  #veil {
    position: fixed;
    inset: 0;
    background: #07080c;
    opacity: 0;
    pointer-events: none;
    z-index: 100;
    transition: opacity 0.5s ease;
  }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div class="header-ui">
  <div class="header-title">ANTIGRAVITY ATELIER</div>
</div>

<div class="footer-ui">
  <div class="object-name" id="objectName">読み込み中...</div>
  <div class="action-pill">タップして作品へ入る · 左右スワイプで切替</div>
  <div class="dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</div>

<div id="veil"></div>

<script>
// iOS Safari / Androidのピンチズーム・ダブルタップズームを100%完全遮断
document.addEventListener('touchstart', function(e) {
  if (e.touches.length > 1) {
    e.preventDefault();
  }
}, { passive: false });

document.addEventListener('touchmove', function(e) {
  if (e.touches.length > 1) {
    e.preventDefault();
  }
}, { passive: false });

let lastTouchEnd = 0;
document.addEventListener('touchend', function(e) {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) {
    e.preventDefault();
  }
  lastTouchEnd = now;
}, { passive: false });

document.addEventListener('gesturestart', function(e) {
  e.preventDefault();
});
document.addEventListener('gesturechange', function(e) {
  e.preventDefault();
});
document.addEventListener('gestureend', function(e) {
  e.preventDefault();
});
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const container = document.getElementById('canvas-container');
const objectNameEl = document.getElementById('objectName');
const dots = document.querySelectorAll('.dot');
const veil = document.getElementById('veil');

// 1. Scene, Camera, Renderer
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 110);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
container.appendChild(renderer.domElement);

// 2. Lights
const ambientLight = new THREE.AmbientLight(0xffffff, 1.8);
scene.add(ambientLight);

const dirLight1 = new THREE.DirectionalLight(0xffffff, 2.8);
dirLight1.position.set(60, 90, 80);
scene.add(dirLight1);

const dirLight2 = new THREE.DirectionalLight(0xa5c8ff, 1.8);
dirLight2.position.set(-60, -50, -60);
scene.add(dirLight2);

// 3. 背景の微小ダスト
const dustCount = 280;
const dustGeo = new THREE.BufferGeometry();
const dustPositions = new Float32Array(dustCount * 3);
for (let i = 0; i < dustCount * 3; i += 3) {
  dustPositions[i] = (Math.random() - 0.5) * 400;
  dustPositions[i + 1] = (Math.random() - 0.5) * 400;
  dustPositions[i + 2] = (Math.random() - 0.5) * 400;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
const dustMat = new THREE.PointsMaterial({ size: 1.2, color: 0x88aaff, transparent: true, opacity: 0.35 });
const dustMesh = new THREE.Points(dustGeo, dustMat);
scene.add(dustMesh);

// 4. 4つのGLBモデル定義
const models = [
  {
    id: 'COLOR',
    name: '01 NAIL POLISH',
    file: 'assets/bottle.glb',
    targetSize: 42,
    baseRotY: 0
  },
  {
    id: 'SURFACE',
    name: '02 FRIENTIRIP',
    file: 'assets/frientirip.glb',
    targetSize: 44,
    baseRotY: Math.PI * 0.25
  },
  {
    id: 'HAND',
    name: '05 WIREFRAME HAND',
    file: 'assets/hand.glb',
    targetSize: 45,
    baseRotY: -Math.PI * 0.3
  },
  {
    id: 'SPACE',
    name: '07 JISAKU HAND',
    file: 'assets/jisakuhand.glb',
    targetSize: 46,
    baseRotY: 0
  }
];

// モデル正規化（画面中央センタリング＆統一スケール）
function prepareModel(model, targetSize) {
  model.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());

  // 原点中心へ正確に補正
  model.position.sub(center);

  // 画面中央に大きく配置
  const maxDim = Math.max(size.x, size.y, size.z);
  const scale = targetSize / (maxDim || 1);
  model.scale.set(scale, scale, scale);

  const wrapper = new THREE.Group();
  wrapper.add(model);
  return wrapper;
}

const carouselGroup = new THREE.Group();
scene.add(carouselGroup);

const carouselItems = [];
const SPACING = 95;
const loader = new GLTFLoader();

let currentIndex = 0;
let targetX = 0;

models.forEach((item, index) => {
  const itemGroup = new THREE.Group();
  itemGroup.position.x = index * SPACING;
  carouselGroup.add(itemGroup);

  // タップ判定用不可視球体
  const hitGeo = new THREE.SphereGeometry(26, 16, 16);
  const hitMat = new THREE.MeshBasicMaterial({ visible: false });
  const hitMesh = new THREE.Mesh(hitGeo, hitMat);
  hitMesh.userData = { index: index, data: item };
  itemGroup.add(hitMesh);

  loader.load(
    item.file,
    gltf => {
      const visual = prepareModel(gltf.scene, item.targetSize);
      visual.rotation.y = item.baseRotY;
      itemGroup.add(visual);

      carouselItems[index] = {
        group: itemGroup,
        visual: visual,
        data: item,
        hitMesh: hitMesh
      };

      if (index === 0) {
        updateActiveUI(0);
      }
    },
    undefined,
    err => console.error('Error loading GLB:', item.file, err)
  );
});

function updateActiveUI(idx) {
  currentIndex = idx;
  objectNameEl.textContent = models[idx].name;
  dots.forEach((d, i) => {
    d.classList.toggle('active', i === idx);
  });
}

// 5. タッチ操作：左右スワイプ＆タップ
let isTouching = false;
let startTouchX = 0, startTouchY = 0;
let lastTouchX = 0;
let hasMoved = false;
let navigating = false;

window.addEventListener('pointerdown', e => {
  if (navigating || e.isPrimary === false) return;
  isTouching = true;
  hasMoved = false;
  startTouchX = e.clientX;
  startTouchY = e.clientY;
  lastTouchX = e.clientX;
});

window.addEventListener('pointermove', e => {
  if (!isTouching || navigating) return;
  const dx = e.clientX - lastTouchX;
  lastTouchX = e.clientX;

  if (Math.abs(e.clientX - startTouchX) > 8) {
    hasMoved = true;
  }

  carouselGroup.position.x += dx * 0.25;
});

window.addEventListener('pointerup', e => {
  if (!isTouching || navigating) return;
  isTouching = false;

  const totalDeltaX = e.clientX - startTouchX;
  const totalDist = Math.hypot(e.clientX - startTouchX, e.clientY - startTouchY);

  if (hasMoved && Math.abs(totalDeltaX) > 35) {
    if (totalDeltaX < 0 && currentIndex < models.length - 1) {
      currentIndex++;
    } else if (totalDeltaX > 0 && currentIndex > 0) {
      currentIndex--;
    }
  } else if (!hasMoved || totalDist <= 8) {
    handleTap(e.clientX, e.clientY);
  }

  snapToIndex(currentIndex);
});

function snapToIndex(idx) {
  targetX = -idx * SPACING;
  updateActiveUI(idx);
}

function handleTap(clientX, clientY) {
  const activeItem = carouselItems[currentIndex];
  if (activeItem) {
    diveToWork(activeItem.data);
  }
}

function diveToWork(data) {
  if (navigating) return;
  navigating = true;
  objectNameEl.textContent = `WARP ➔ ${data.name}`;
  veil.style.opacity = '1';

  setTimeout(() => {
    window.location.href = `../experience-prototype/?work=${data.id}&v=antigravity`;
  }, 450);
}

// リサイズ対応
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// 6. アニメーションループ
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();
  const time = clock.getElapsedTime();

  // カルーセルの滑らかなスナップ
  if (!isTouching) {
    carouselGroup.position.x += (targetX - carouselGroup.position.x) * 0.12;
  }

  // 各モデルの浮遊と自転
  carouselItems.forEach((item, index) => {
    if (!item || !item.visual) return;
    item.visual.position.y = Math.sin(time * 1.6 + index * 1.5) * 2.2;
    item.visual.rotation.y += 0.007;
    item.visual.rotation.z = Math.sin(time * 0.9 + index) * 0.05;
  });

  dustMesh.rotation.y = time * 0.01;

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
