<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>TOUCH HANDS</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07080c;color:#f2f5fa;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
#stage{position:fixed;inset:env(safe-area-inset-top,0px) 0 calc(80px + env(safe-area-inset-bottom,0px));touch-action:none;isolation:isolate}
#canvas-container{position:absolute;inset:0;pointer-events:none}
canvas{display:block;width:100%;height:100%}
#works{position:absolute;inset:0}
.work{position:absolute;display:block;left:var(--x);top:var(--y);width:var(--size);height:var(--size);transform:translate(-50%,-50%);border-radius:50%;outline-offset:5px;touch-action:none}
.work img{width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none;-webkit-user-drag:none;transition:opacity .55s ease,filter .2s ease;filter:drop-shadow(0 0 8px #a5c8ff18)}
.work:focus-visible{outline:1px solid #e7d4a6;background:#e7d4a609}
.work:active img{filter:drop-shadow(0 0 12px #e7d4a655)}
.work.is-ready img{opacity:0}
.work.is-loading::after{content:"";position:absolute;inset:18%;border:1px solid #b9d0ef24;border-top-color:#d7e4f37a;border-radius:50%;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.3;transform:scale(.94)}}
.touch-hands-nav{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;z-index:25}
.touch-hands-title{margin:0;pointer-events:none;font-size:clamp(17px,4.6vw,22px);font-weight:300;letter-spacing:.32em;text-indent:.32em;color:#fff;text-shadow:0 0 24px #ffffff66}
.touch-to-enter{display:inline-flex;align-items:center;justify-content:center;color:rgba(255,255,255,.92);text-decoration:none;font-size:14px;font-weight:500;letter-spacing:.26em;text-indent:.26em;padding:9px 26px;border-radius:999px;border:1px solid rgba(255,255,255,.32);background:rgba(18,20,28,.58);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 4px 18px rgba(0,0,0,.45);transition:all .3s ease;animation:breathe-enter 3.4s ease-in-out infinite}
.touch-to-enter:hover,.touch-to-enter:focus-visible{color:#fff;border-color:rgba(231,212,166,.9);background:rgba(231,212,166,.22);box-shadow:0 0 22px rgba(231,212,166,.42)}
@keyframes breathe-enter{0%,100%{opacity:.82;transform:scale(1);box-shadow:0 4px 18px rgba(0,0,0,.45)}50%{opacity:1;transform:scale(1.04);border-color:rgba(255,255,255,.6);box-shadow:0 0 24px rgba(255,255,255,.32)}}
#touch-ring{position:fixed;width:36px;height:36px;border:1px solid #fff;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;opacity:0;z-index:20;box-shadow:0 0 16px #ffffff26}
#touch-ring::after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;transform:translate(-50%,-50%);border-radius:50%;background:#d5b574}
#veil{position:fixed;inset:0;background:#07080c;opacity:0;pointer-events:none;z-index:30;transition:opacity .25s ease}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media(max-height:480px){#stage{bottom:calc(64px + env(safe-area-inset-bottom,0px))}.touch-hands-nav{bottom:calc(8px + env(safe-area-inset-bottom,0px));gap:5px}.touch-hands-title{font-size:15px}.touch-to-enter{font-size:12px;padding:6px 16px}}
</style>
</head>
<body>
<main id="stage" aria-label="４つの造形に触れて作品へ。なでると空間が動きます。">
  <div id="canvas-container" aria-hidden="true"></div>
  <nav id="works" aria-label="作品を選ぶ">
    <a class="work" data-work="COLOR" href="../experience-prototype/?work=COLOR" aria-label="色の作品へ" style="--x:50%;--y:22%;--size:130px"><img src="assets/mobile71/bottle.webp" alt="" width="384" height="384" fetchpriority="high"></a>
    <a class="work" data-work="SURFACE" href="../experience-prototype/?work=SURFACE" aria-label="表面の作品へ" style="--x:76%;--y:50%;--size:130px"><img src="assets/mobile71/frientirip.webp" alt="" width="384" height="384"></a>
    <a class="work" data-work="HAND" href="../experience-prototype/?work=HAND" aria-label="手の作品へ" style="--x:50%;--y:78%;--size:130px"><img src="assets/mobile71/hand.webp" alt="" width="384" height="384"></a>
    <a class="work" data-work="SPACE" href="../experience-prototype/?work=SPACE" aria-label="宇宙と手の作品へ" style="--x:24%;--y:50%;--size:130px"><img src="assets/mobile71/jisakuhand.webp" alt="" width="384" height="384"></a>
  </nav>
</main>
<nav class="touch-hands-nav" aria-label="作品体験の入口">
  <h1 class="touch-hands-title">TOUCH HANDS</h1>
  <a class="touch-to-enter" id="touchToEnter" href="../experience-prototype/" aria-label="作品一覧へ進む">TOUCH TO ENTER</a>
</nav>
<p class="sr-only" role="status" id="load-status">作品の入口を表示しています。</p>
<div id="touch-ring" aria-hidden="true"></div>
<div id="veil" aria-hidden="true"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="./main.mjs"></script>
</body>
</html>
