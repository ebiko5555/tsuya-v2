<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1824"><title>tsuya / 手元を試す</title><link rel="stylesheet" href="style.css?v=male01"></head><body class="try-page"><header class="try-top"><a class="brand" href="./">tsuya<small>HAND FORM</small></a><a class="back" href="./">← 目的を選び直す</a></header><main class="try-layout"><section class="try-stage"><span class="try-stamp">HAND FORM / TRY ON</span><img class="try-hand" src="../experience-prototype/art-assets/hand-drawing.webp" alt="試着する手元"><span class="try-help">カメラに手をかざして、手元を確認する</span></section><section class="try-copy"><p class="eyebrow">05 / HAND MEMORY</p><h1>仕事になじむ、<br>自然な手元。</h1><p class="summary">手の形を見ながら、色・ツヤ・長さを選べます。はじめは控えめな設定から試してみましょう。</p><div class="set-panel"><div class="set-panel-head"><b>HAND FORM / 5本セット</b><span>素材：線・淡い銀</span></div><div class="nails" aria-label="5本のネイル見本"><i></i><i></i><i></i><i></i><i></i></div><div class="option-label"><button class="active">自然な長さ</button><button>少し長め</button></div></div><a class="primary try-button" href="../special-prototype/app.html?try=HAND&length=short&v=male01">カメラで手元を試す <span>↗</span></a><p class="fine-print">カメラを使うまで、画像は外部へ送られません。写真から色をつくる場合は、試着後の「写真」から進めます。</p></section></main><script>document.querySelectorAll('.option-label button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.option-label button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}));</script></body></html>
