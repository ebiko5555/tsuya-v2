<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>艶 II — 手と光のアトリエ</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"
        onerror="window.__mpFailed=true"></script>
<style>
  :root{
    --bg:#f4efe9; --ink:#2a2522; --sub:#8f8378; --faint:#b5a99d;
    --card:#fffdfa; --accent:#a4735c; --line:rgba(42,37,34,.12);
    --shadow:0 18px 60px rgba(90,66,50,.16), 0 2px 10px rgba(90,66,50,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{height:100%; overscroll-behavior:none}
  body{
    font-family:"Hiragino Sans","Yu Gothic",sans-serif;
    background:
      radial-gradient(120% 80% at 50% -10%, #fbf8f4 0%, var(--bg) 60%),
      var(--bg);
    color:var(--ink);
    display:flex; flex-direction:column;
    max-width:520px; margin:0 auto;
  }
  /* ---------- ヘッダ ---------- */
  header{
    flex:none; text-align:center;
    padding:calc(14px + env(safe-area-inset-top)) 0 14px;
  }
  .overline{
    font-size:8.5px; letter-spacing:.55em; color:var(--faint);
    text-transform:uppercase; margin-bottom:6px; text-indent:.55em;
  }
  header h1{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:clamp(58px, 20vw, 76px); font-weight:400; line-height:1;
    letter-spacing:.04em;
    background:linear-gradient(135deg, #8a5a45 0%, #d4a887 45%, #8a5a45 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  header .rule{
    width:28px; height:1px; background:var(--ink); opacity:.35;
    margin:12px auto 0;
  }
  /* ---------- ステージ ---------- */
  .stage{
    position:relative; flex:1; min-height:0; margin:0 18px;
    background:#e9e1d8; border-radius:20px; overflow:hidden;
    box-shadow:var(--shadow);
  }
  #canvas{width:100%; height:100%; object-fit:cover; display:block}
  #startOverlay{
    position:absolute; inset:0; z-index:5;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:32px;
    background:radial-gradient(90% 70% at 50% 20%, #f9f4ee 0%, #efe6dc 100%);
  }
  #startOverlay .invite{
    font-family:"Hiragino Mincho ProN",serif; font-size:15px;
    letter-spacing:.6em; text-indent:.6em; color:#7a6c60; margin-bottom:34px;
  }
  .bigbtn{
    border:none; border-radius:999px; padding:16px 50px;
    background:linear-gradient(135deg, #c3906f, #a4735c);
    color:#fffdfa; font-size:13px; letter-spacing:.3em; text-indent:.3em;
    font-family:inherit; cursor:pointer;
    box-shadow:0 10px 28px rgba(164,115,92,.38);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .bigbtn:active{transform:scale(.97); box-shadow:0 4px 12px rgba(164,115,92,.38)}
  #status{
    margin-top:26px; font-size:10px; letter-spacing:.2em; color:var(--faint);
    min-height:14px; transition:opacity .3s;
  }
  #guide{
    position:absolute; top:16px; left:0; right:0; text-align:center; z-index:4;
    font-size:11px; letter-spacing:.25em; text-indent:.25em; color:#fff;
    text-shadow:0 1px 8px rgba(0,0,0,.5); pointer-events:none;
    transition:opacity .5s;
  }
  #countdown{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    font-family:"Hiragino Mincho ProN",serif; font-size:96px; font-weight:300; color:#fff;
    text-shadow:0 2px 24px rgba(0,0,0,.4); z-index:6; pointer-events:none;
  }
  .stagebtns{
    position:absolute; bottom:16px; left:0; right:0; z-index:5;
    display:flex; align-items:center; justify-content:center; gap:28px;
  }
  .shutter{
    width:60px; height:60px; border-radius:50%; cursor:pointer;
    border:3px solid rgba(255,255,255,.95);
    background:rgba(255,255,255,.18); backdrop-filter:blur(6px);
    transition:background .15s;
  }
  .shutter:active{background:#fff}
  .roundbtn{
    width:40px; height:40px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(20,15,12,.32); color:#fff; font-size:15px; backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
  }
  #snapBar{
    position:absolute; bottom:16px; left:0; right:0; z-index:7;
    display:none; justify-content:center; gap:10px;
  }
  #snapBar .pill{
    border:none; border-radius:999px; padding:13px 26px; font-size:12px;
    font-family:inherit; letter-spacing:.18em; text-indent:.18em; cursor:pointer;
    background:rgba(20,15,12,.5); color:#fff; backdrop-filter:blur(8px);
  }
  #snapBar .pill.primary{background:#fdfaf7; color:var(--ink)}
  /* ---------- 下部パネル ---------- */
  .panel{
    flex:none;
    padding:14px 20px calc(12px + env(safe-area-inset-bottom));
  }
  .tabs{display:flex; gap:20px; margin-bottom:12px; justify-content:center; flex-wrap:wrap}
  .tab{
    position:relative;
    font-size:10.5px; letter-spacing:.3em; text-indent:.3em;
    color:var(--faint); padding:4px 0 7px; cursor:pointer;
    transition:color .25s;
  }
  .tab::after{
    content:""; position:absolute; left:50%; bottom:0; height:1px; width:0;
    background:var(--ink); transform:translateX(-50%);
    transition:width .25s ease;
  }
  .tab.active{color:var(--ink)}
  .tab.active::after{width:100%}
  .tray{display:none}
  .tray.active{display:block; animation:rise .3s ease}
  @keyframes rise{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}
  .scroller{
    display:flex; gap:13px; overflow-x:auto; padding:6px 2px 6px;
    scrollbar-width:none;
  }
  .scroller::-webkit-scrollbar{display:none}
  /* デザインサムネ：爪型 */
  .look{flex:none; text-align:center; cursor:pointer}
  .look canvas{
    width:52px; height:66px; display:block; margin:0 auto;
    border-radius:24px 24px 20px 20px;
    background:var(--card);
    box-shadow:0 3px 10px rgba(90,66,50,.14);
    border:1.5px solid transparent;
    transition:transform .2s ease, border-color .2s;
  }
  .look.active canvas{border-color:var(--ink); transform:translateY(-3px)}
  .look span{
    font-size:9px; letter-spacing:.06em; color:var(--sub);
    display:block; margin-top:6px;
  }
  .look.active span{color:var(--ink)}
  /* 色チップ */
  .chip{
    flex:none; width:36px; height:36px; border-radius:50%; cursor:pointer;
    border:2px solid transparent;
    box-shadow:inset 0 -7px 10px rgba(0,0,0,.14), inset 0 4px 6px rgba(255,255,255,.35), 0 2px 8px rgba(90,66,50,.16);
    transition:transform .2s ease;
  }
  .chip.active{border-color:var(--ink); transform:scale(1.12)}
  input.chip{padding:0; -webkit-appearance:none; appearance:none; background:none}
  input.chip::-webkit-color-swatch-wrapper{padding:0}
  input.chip::-webkit-color-swatch{border:none; border-radius:50%}
  .minirow{
    display:flex; align-items:center; gap:12px; margin-top:10px;
    font-size:10px; letter-spacing:.15em; color:var(--sub);
  }
  input[type=range]{
    flex:1; -webkit-appearance:none; appearance:none; height:22px; background:transparent;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:1.5px; background:var(--line); border-radius:2px;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:16px; height:16px; border-radius:50%;
    background:var(--card); border:1.5px solid var(--ink);
    margin-top:-7.5px; box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  .ghostlink{
    font-size:10.5px; color:var(--accent); letter-spacing:.12em;
    text-decoration:underline; text-underline-offset:4px; text-decoration-thickness:.5px;
    cursor:pointer; white-space:nowrap;
  }
  #note{
    font-size:10.5px; color:var(--sub); margin-top:8px; min-height:15px;
    line-height:1.8; letter-spacing:.05em;
  }
  .presetgroup{margin-bottom:16px}
  .presetgroup:last-child{margin-bottom:0}
  .presetlabel{
    font-size:10px; letter-spacing:.25em; text-indent:.1em; color:var(--sub);
    margin-bottom:8px;
  }
  .presetrow{display:flex; gap:8px}
  .presetbtn{
    flex:1; border:1px solid var(--line); border-radius:999px; padding:10px 4px;
    background:transparent; color:var(--sub); font-family:inherit;
    font-size:10.5px; letter-spacing:.04em; cursor:pointer;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .presetbtn.active{background:var(--accent); border-color:var(--accent); color:#fffdfa}
  input[type=file]{display:none}
  /* 追加タイル */
  .addtile .addbox{
    width:52px; height:66px; margin:0 auto;
    border-radius:24px 24px 20px 20px;
    border:1.2px dashed var(--faint); color:var(--sub);
    display:flex; align-items:center; justify-content:center;
    font-size:9.5px; letter-spacing:.05em; line-height:1.5;
    background:rgba(255,253,250,.6);
  }
  .addtile .addbox svg{width:22px; height:22px; display:block}
  /* 指ごとのデザイン */
  .fingerrow{display:flex; align-items:flex-end; justify-content:center; gap:5px; margin-bottom:5px}
  .fingerbtn{flex:none; cursor:pointer; text-align:center; padding:3px 3px 0}
  .fingerbtn canvas{
    width:26px; height:33px; display:block; border-radius:12px 12px 10px 10px;
    background:var(--card); box-shadow:0 2px 6px rgba(90,66,50,.14);
    border:1.4px solid transparent; transition:border-color .2s, transform .2s;
  }
  .fingerbtn.active canvas{border-color:var(--ink); transform:translateY(-2px)}
  .fingerbtn span{font-size:8.5px; color:var(--faint); display:block; margin-top:4px}
  .fingerbtn.active span{color:var(--ink)}
  .allbtn{
    flex:none; align-self:center; border:1px solid var(--line); border-radius:999px;
    padding:7px 11px; margin-right:3px; background:transparent; color:var(--sub);
    font-family:inherit; font-size:10px; letter-spacing:.05em; cursor:pointer;
  }
  .allbtn.active{background:var(--accent); border-color:var(--accent); color:#fffdfa}
  /* 保存した組み合わせ */
  .setrow{display:flex; align-items:center; gap:10px; margin-top:2px}
  .setrow .scroller{flex:1; min-width:0; padding:7px 2px 2px}
  .setchip{flex:none; cursor:pointer; text-align:center; position:relative}
  .setchip canvas{display:block; border-radius:7px; background:var(--card); box-shadow:0 2px 7px rgba(90,66,50,.14)}
  .setchip span{
    font-size:9px; color:var(--sub); display:block; margin-top:3px;
    max-width:80px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .setchip .del{
    position:absolute; top:-7px; right:-7px; width:17px; height:17px; border-radius:50%;
    background:rgba(42,37,34,.5); color:#fff; font-size:11px; line-height:17px; text-align:center;
  }
  .setempty{font-size:10px; color:var(--faint); letter-spacing:.05em; padding:10px 2px}
  /* 光の軌跡タブ */
  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 2px; font-size:11.5px; letter-spacing:.1em; color:var(--ink);
  }
  .switch{
    position:relative; width:42px; height:24px; border-radius:999px;
    background:var(--line); cursor:pointer; transition:background .25s;
    flex:none;
  }
  .switch.on{background:var(--accent)}
  .switch::after{
    content:""; position:absolute; top:3px; left:3px; width:18px; height:18px;
    border-radius:50%; background:#fffdfa; box-shadow:0 1px 4px rgba(0,0,0,.2);
    transition:transform .25s ease;
  }
  .switch.on::after{transform:translateX(18px)}
  .hikari-desc{
    font-size:10.5px; color:var(--sub); line-height:1.9; letter-spacing:.05em;
    margin-top:6px;
  }
  .swatchrow{display:flex; gap:10px; margin-top:10px}
  .swatch{
    flex:none; width:30px; height:30px; border-radius:50%; cursor:pointer;
    border:2px solid transparent;
  }
  .swatch.active{border-color:var(--ink)}
  /* ---------- お絵かきエディタ ---------- */
  #editor{
    position:fixed; inset:0; z-index:50; display:none;
    align-items:center; justify-content:center;
    background:rgba(42,37,34,.45); backdrop-filter:blur(8px);
    padding:20px;
  }
  .edcard{
    width:100%; max-width:360px; background:var(--card);
    border-radius:20px; padding:18px 18px 16px;
    box-shadow:var(--shadow);
  }
  .edtitle{
    font-family:"Hiragino Mincho ProN",serif; text-align:center;
    font-size:13px; letter-spacing:.3em; text-indent:.3em; margin-bottom:12px;
  }
  .edstage{
    display:flex; justify-content:center;
    background:
      conic-gradient(#f1eae2 25%, #faf6f1 0 50%, #f1eae2 0 75%, #faf6f1 0) 0 0/16px 16px;
    border-radius:14px; padding:10px;
  }
  #edCanvas{
    width:210px; height:280px; touch-action:none; cursor:crosshair;
    background:linear-gradient(#f4e2d7,#eccfc0);
    border-radius:70px 70px 54px 54px;
    box-shadow:0 4px 14px rgba(90,66,50,.18);
  }
  .edrow{display:flex; gap:8px; align-items:center; margin-top:12px; flex-wrap:wrap}
  .edsw{
    width:26px; height:26px; border-radius:50%; cursor:pointer;
    box-shadow:inset 0 -4px 6px rgba(0,0,0,.14), 0 1px 4px rgba(0,0,0,.12);
  }
  .edbtn{
    border:1px solid var(--line); border-radius:999px; padding:8px 14px;
    background:transparent; color:var(--sub); font-family:inherit;
    font-size:11px; letter-spacing:.1em; cursor:pointer;
  }
  .edbtn.on{border-color:var(--ink); color:var(--ink)}
  .edbtn.primary{background:var(--ink); color:#fdfaf7; border-color:var(--ink)}
  .edrow.acts{justify-content:flex-end; margin-top:14px}
</style>
</head>
<body>
<header>
  <div class="overline">Hand &amp; Light Atelier</div>
  <h1>艶</h1>
  <div class="rule"></div>
</header>

<div class="stage">
  <canvas id="canvas"></canvas>
  <div id="guide" style="opacity:0">手をかざしてください</div>
  <div id="countdown"></div>

  <div id="startOverlay">
    <p class="invite">手をかざす</p>
    <button class="bigbtn" id="startBtn">はじめる</button>
    <div id="status"></div>
  </div>

  <div class="stagebtns" id="liveBtns" style="display:none">
    <button class="roundbtn" id="timerBtn" title="セルフタイマー">3s</button>
    <button class="shutter" id="shutterBtn" title="撮影"></button>
    <button class="roundbtn" id="flipBtn" title="カメラ切替">⟲</button>
  </div>

  <div id="snapBar">
    <button class="pill primary" id="saveBtn">保存する</button>
    <button class="pill" id="retryBtn">もう一度</button>
  </div>
</div>

<div class="panel">
  <div class="tabs">
    <div class="tab active" data-t="looks">デザイン</div>
    <div class="tab" data-t="colors">カラー</div>
    <div class="tab" data-t="tune">質感</div>
    <div class="tab" data-t="sculpt">スカルプ</div>
    <div class="tab" data-t="hikari">光</div>
  </div>

  <div class="tray active" id="tray-looks">
    <div class="fingerrow" id="fingerRow"></div>
    <div class="scroller" id="looksRow"></div>
    <div class="minirow" id="varRow" style="display:none">
      <span id="varLabel">柄</span>
      <input type="range" id="varSlider" min="0" max="100" value="50">
    </div>
    <div class="setrow">
      <div class="scroller" id="setsRow"></div>
      <span class="ghostlink" id="saveSetLink">この組み合わせを保存</span>
    </div>
  </div>

  <div class="tray" id="tray-colors">
    <div class="fingerrow" id="fingerRow2"></div>
    <div class="scroller" id="chips"></div>
    <div class="minirow">
      <span class="ghostlink" onclick="document.getElementById('inspoInput').click()">写真</span>
    </div>
    <div id="note"></div>
  </div>

  <div class="tray" id="tray-tune">
    <div class="presetgroup">
      <div class="presetlabel">ツヤ</div>
      <div class="presetrow" data-key="gloss">
        <button class="presetbtn" data-val="10">マット</button>
        <button class="presetbtn active" data-val="65">セミグロス</button>
        <button class="presetbtn" data-val="100">ツヤツヤ</button>
      </div>
    </div>
    <div class="presetgroup">
      <div class="presetlabel">濃さ</div>
      <div class="presetrow" data-key="opacity">
        <button class="presetbtn" data-val="65">うすづき</button>
        <button class="presetbtn active" data-val="96">ふつう</button>
        <button class="presetbtn" data-val="100">しっかり</button>
      </div>
    </div>
    <div class="presetgroup">
      <div class="presetlabel">大きさ</div>
      <div class="presetrow" data-key="nailSize">
        <button class="presetbtn" data-val="85">ナチュラル</button>
        <button class="presetbtn active" data-val="100">ふつう</button>
        <button class="presetbtn" data-val="120">長め</button>
      </div>
    </div>
  </div>

  <div class="tray" id="tray-sculpt">
    <div class="minirow">長さ <input type="range" id="sculptLen" min="100" max="220" value="140"></div>
    <div class="presetgroup">
      <div class="presetlabel">形</div>
      <div class="presetrow" data-key="sculptShape">
        <button class="presetbtn active" data-val="natural">ナチュラル</button>
        <button class="presetbtn" data-val="round2">ラウンド</button>
        <button class="presetbtn" data-val="almond">ポイント(アーモンド)</button>
        <button class="presetbtn" data-val="square">スクエア</button>
        <button class="presetbtn" data-val="coffin">バレリーナ(コフィン)</button>
      </div>
    </div>
    <p class="hikari-desc">長さのスライダーでスカルプのように爪先を伸ばし、下の形から先端のシルエットを選べます。</p>
  </div>

  <div class="tray" id="tray-hikari">
    <div class="toggle-row">
      <span>指先に光の軌跡を残す</span>
      <div class="switch on" id="trailSwitch"></div>
    </div>
    <div class="minirow">軌跡の強さ <input type="range" id="trailIntensity" min="0" max="100" value="55"></div>
    <div class="minirow">色</div>
    <div class="swatchrow" id="trailSwatches"></div>
    <p class="hikari-desc">手を動かすたび、爪の色に呼応した光がやわらかく尾を引きます。手を止めると静かに消えていきます。</p>
  </div>
</div>

<input type="file" id="inspoInput" accept="image/*">
<input type="file" id="designInput" accept="image/*">
<video id="video" playsinline style="display:none"></video>

<!-- お絵かきエディタ -->
<div id="editor">
  <div class="edcard">
    <div class="edtitle">マイデザインを描く</div>
    <div class="edstage"><canvas id="edCanvas" width="300" height="400"></canvas></div>
    <div class="edrow" id="edSwatches"></div>
    <div class="edrow tools">
      <button class="edbtn on" id="edPen">ペン</button>
      <button class="edbtn" id="edFine">細ペン</button>
      <button class="edbtn" id="edAir">エアブラシ</button>
      <button class="edbtn" id="edErase">消しゴム</button>
      <button class="edbtn" id="edClear">全消し</button>
      <input type="range" id="edSize" min="3" max="46" value="14">
    </div>
    <div class="edrow acts">
      <button class="edbtn" id="edCancel">やめる</button>
      <button class="edbtn primary" id="edDone">これを爪に乗せる</button>
    </div>
  </div>
</div>

<script>
/* ================= 状態 ================= */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const video = document.getElementById('video');
let mode = 'idle';            // idle | live | frozen
let facing = 'environment';
let stream = null;
let currentColor = '#b76e79';
let currentLook = 'onecolor';
let smoothed = [];
let rafOn = false;
const tuneVals = { gloss:65, opacity:96, nailSize:100, sculptLen:140, sculptShape:'natural' };
const $ = id => document.getElementById(id);

function setStatus(t){ $('status').textContent = t || ''; }
function setGuide(t){
  const g = $('guide');
  g.textContent = t || '';
  g.style.opacity = t ? 1 : 0;
}

/* ================= MediaPipe（初期化を待ってから使う） ================= */
const MP_CDN = 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/';
let liveHands = null, liveReady = null;

function makeHands(opts){
  const h = new Hands({locateFile: f => MP_CDN + f});
  h.setOptions(opts);
  return h;
}
function ensureLive(){
  if(window.__mpFailed) return Promise.reject(new Error('cdn'));
  if(!liveReady){
    liveHands = makeHands({maxNumHands:2, modelComplexity:1, minDetectionConfidence:0.6, minTrackingConfidence:0.6});
    liveHands.onResults(res => {
      const lms = res.multiHandLandmarks || [];
      if(lms.length){ lastSeenT = performance.now(); updateLandmarks(lms); }
      else if(performance.now() - lastSeenT > 280){ smoothed.length = 0; }
      liveBusy = false;
    });
    liveReady = liveHands.initialize();
  }
  return liveReady;
}
let lastSeenT = 0;
function updateLandmarks(lms){
  const now = performance.now();
  const dt = Math.min(0.1, Math.max(0.001, (now - (updateLandmarks._t||now-16))/1000));
  updateLandmarks._t = now;
  lms.forEach((lm,h) => {
    if(!smoothed[h] || smoothed[h].length !== lm.length){
      smoothed[h] = lm.map(p=>({x:p.x, y:p.y, vx:0, vy:0}));
      return;
    }
    lm.forEach((p,i)=>{
      const s = smoothed[h][i];
      [['x','vx'],['y','vy']].forEach(([ax,v])=>{
        const d = p[ax]-s[ax];
        if(Math.abs(d) < 0.0022){ s[v]*=0.5; return; }
        const dv = d/dt;
        s[v] += alphaFor(1.0, dt)*(dv - s[v]);
        const cutoff = 1.0 + 25*Math.abs(s[v]);
        s[ax] += alphaFor(cutoff, dt)*d;
      });
    });
  });
  smoothed.length = lms.length;
}
function alphaFor(cutoff, dt){
  const r = 2*Math.PI*cutoff*dt;
  return r/(r+1);
}

async function startCamera(){
  setStatus('準備しています…');
  try{ await ensureLive(); }
  catch(e){

    return;
  }
  try{

    stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:facing, width:{ideal:1280}, height:{ideal:720}}, audio:false
    });
    video.srcObject = stream;
    await video.play();
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    mode = 'live';
    smoothed = [];

    $('liveBtns').style.display='flex';

  }catch(e){

  }
}

/* 描画ループ：AIとは独立して映像を常に描く */
let liveBusy = false;
function startLoops(){
  if(rafOn) return;
  rafOn = true;
  let lastT = performance.now();
  (function draw(now){
    const dt = Math.min(0.05, Math.max(0.001, (now - lastT)/1000)); lastT = now;
    if(mode === 'live' && video.readyState >= 2){
      ctx.save();
      if(mirrored()){ ctx.translate(canvas.width,0); ctx.scale(-1,1); }
      ctx.drawImage(video,0,0,canvas.width,canvas.height);
      ctx.restore();
      recordTrails();
      drawTrails(dt);
      drawNails();
      setGuide(smoothed.length ? '' : '手をかざしてください');
    }
    requestAnimationFrame(draw);
  })(lastT);
  (async function detect(){
    if(mode === 'live' && video.readyState >= 2 && !liveBusy){
      liveBusy = true;
      try{ await liveHands.send({image: video}); }
      catch(e){ liveBusy = false; }
    }
    requestAnimationFrame(detect);
  })();
}

async function loadImage(file){
  let bmp;
  try{ bmp = await createImageBitmap(file, {imageOrientation:'from-image'}); }
  catch(e){
    bmp = await new Promise(r=>{ const img=new Image(); img.onload=()=>r(img); img.src=URL.createObjectURL(file); });
  }
  const MAX = 1400;
  const sc = Math.min(1, MAX/Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width*sc); c.height = Math.round(bmp.height*sc);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return c;
}

/* ================= 爪の描画 ================= */
const FINGERS = [[4,3],[8,7],[12,11],[16,15],[20,19]];
/* 手のひらの骨。どれか1本が奥行きでつぶれても、一番長いものは残る */
const PALM_BONES = [[0,5],[0,17],[5,17],[0,9],[0,13],[9,17]];
/* 手のひらの大きさに対する、指節の長さの目安（手を平らにした時の実測比の75%）。
   爪の大きさの下限に使う。指先をカメラに向けると画面上の指節長がほぼ0になり、
   そのままだと爪が消えてしまうため。 */
const MIN_LEN_RATIO = [0.240, 0.173, 0.188, 0.173, 0.143];   /* 親指は常に角度がつくので下限を高めに */
const nailState = [];
function mirrored(){ return facing==='user'; }
function lmXY(p){
  let x = p.x*canvas.width, y = p.y*canvas.height;
  if(mirrored()) x = canvas.width - x;
  return [x,y];
}
function drawNails(){
  const alpha = tuneVals.opacity/100;
  const gloss = tuneVals.gloss/100;
  const scale = tuneVals.nailSize/100;
  smoothed.forEach((lm, hi)=>{
    /* この手が画面上でどれくらいの大きさか（指の向きに左右されない基準） */
    let handRef = 0;
    PALM_BONES.forEach(([a,b])=>{
      const [ax,ay]=lmXY(lm[a]), [bx,by]=lmXY(lm[b]);
      const d = Math.hypot(ax-bx, ay-by);
      if(d > handRef) handRef = d;
    });
    FINGERS.forEach(([tip,dip], fi)=>{
      const [tx,ty]=lmXY(lm[tip]), [dx,dy]=lmXY(lm[dip]);
      /* 奥行きで指節がつぶれても、爪がここまでしか小さくならないようにする */
      const rawLen = Math.max(Math.hypot(tx-dx,ty-dy), handRef*MIN_LEN_RATIO[fi]);
      if(rawLen < 4) return;
      const rawAng = Math.atan2(ty-dy,tx-dx);
      const st = nailState[hi*5+fi] || (nailState[hi*5+fi] = {len:rawLen, ang:rawAng});
      const dLen = rawLen - st.len;
      if(Math.abs(dLen) > st.len*0.035) st.len += dLen*Math.min(1, 0.12 + Math.abs(dLen)/st.len);
      let dAng = ((rawAng - st.ang + Math.PI*3) % (Math.PI*2)) - Math.PI;
      if(Math.abs(dAng) > 0.035) st.ang += dAng*Math.min(1, 0.15 + Math.abs(dAng)*2);
      const len = st.len, ang = st.ang;
      const lenPct = tuneVals.sculptLen/100;
      const shape = tuneVals.sculptShape;
      const w = len*(0.54 - 0.06*(lenPct-1))*scale;
      const h = len*0.94*scale*lenPct;
      const pushOut = len*(0.10 + 0.30*(lenPct-1));
      ctx.save();
      ctx.translate(tx+Math.cos(ang)*pushOut, ty+Math.sin(ang)*pushOut);
      ctx.rotate(ang+Math.PI/2);
      nailPath(w,h,shape);
      ctx.clip();
      ctx.globalAlpha = alpha;
      paintByKey(ctx,nailLooks[fi],w,h,nailColors[fi],hi*5+fi);
      ctx.globalAlpha = alpha*0.3;
      const rim = ctx.createRadialGradient(0,0,Math.min(w,h)*0.35, 0,0,Math.max(w,h)*0.75);
      rim.addColorStop(0,'rgba(0,0,0,0)');
      rim.addColorStop(1,'rgba(60,30,20,.5)');
      ctx.fillStyle=rim; ctx.fillRect(-w,-h,w*2,h*2);
      if(gloss>0.05 && !flatLook(nailLooks[fi])){
        ctx.globalAlpha = alpha*gloss*0.6;
        ctx.fillStyle='#fff';
        ctx.beginPath();
        ctx.ellipse(-w*0.18,-h*0.20,w*0.15,h*0.26,-0.3,0,Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = alpha*gloss*0.28;
        ctx.beginPath();
        ctx.ellipse(w*0.2,h*0.05,w*0.09,h*0.15,0.2,0,Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    });
  });
}
function flatLook(key){ const lk=LOOKS[key]; return !!(lk && lk.flat); }
function nailPath(w,h,shape){
  ctx.beginPath();
  const base = h*0.28;
  ctx.moveTo(-w/2, base);
  switch(shape){
    case 'round2':
      ctx.bezierCurveTo(-w/2, h*0.02, -w*0.34, -h*0.42, 0, -h*0.46);
      ctx.bezierCurveTo(w*0.34, -h*0.42, w/2, h*0.02, w/2, base);
      break;
    case 'almond':
      ctx.bezierCurveTo(-w/2, -h*0.08, -w*0.20, -h*0.52, 0, -h*0.58);
      ctx.bezierCurveTo(w*0.20, -h*0.52, w/2, -h*0.08, w/2, base);
      break;
    case 'square':
      ctx.bezierCurveTo(-w/2, -h*0.10, -w/2, -h*0.42, -w/2, -h*0.50);
      ctx.lineTo(w/2, -h*0.50);
      ctx.bezierCurveTo(w/2, -h*0.42, w/2, -h*0.10, w/2, base);
      break;
    case 'coffin':
      ctx.bezierCurveTo(-w/2, -h*0.05, -w*0.30, -h*0.40, -w*0.22, -h*0.50);
      ctx.lineTo(w*0.22, -h*0.50);
      ctx.bezierCurveTo(w*0.30, -h*0.40, w/2, -h*0.05, w/2, base);
      break;
    default:
      ctx.bezierCurveTo(-w/2, -h*0.26, -w*0.32, -h*0.50, 0, -h*0.50);
      ctx.bezierCurveTo(w*0.32, -h*0.50, w/2, -h*0.26, w/2, base);
  }
  ctx.bezierCurveTo(w/2, h*0.48, w*0.28, h*0.56, 0, h*0.56);
  ctx.bezierCurveTo(-w*0.28, h*0.56, -w/2, h*0.48, -w/2, base);
  ctx.closePath();
}

/* ================= 光の軌跡（アート表現） ================= */
let trailOn = true;
let trailIntensity = 55;
let trailHue = null; // null = ネイルカラーに追従
const TRAIL_LIFE = 620; // ms
const trails = []; // {x,y,born,color}
let lastTrailPos = null;

function currentTrailColor(){
  return trailHue || currentColor;
}
function recordTrails(){
  if(!trailOn || !smoothed.length) return;
  const now = performance.now();
  const col = currentTrailColor();
  smoothed.forEach(lm=>{
    FINGERS.forEach(([tip])=>{
      const [x,y] = lmXY(lm[tip]);
      const key = x+','+y;
      const last = trails.length ? trails[trails.length-1] : null;
      if(last && Math.hypot(x-last.x, y-last.y) < 3) return;
      trails.push({x,y,born:now,color:col});
    });
  });
  const cutoff = now - TRAIL_LIFE;
  while(trails.length && trails[0].born < cutoff) trails.shift();
  if(trails.length > 420) trails.splice(0, trails.length-420);
}
function drawTrails(){
  if(!trails.length) return;
  const now = performance.now();
  const strength = trailIntensity/100;
  if(strength<=0) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  trails.forEach(pt=>{
    const age = (now - pt.born)/TRAIL_LIFE;
    if(age >= 1) return;
    const life = 1-age;
    const r = 4 + life*16;
    const g = ctx.createRadialGradient(pt.x,pt.y,0, pt.x,pt.y,r);
    const glow = shade(pt.color, 70);
    g.addColorStop(0, hexA(glow, life*0.55*strength));
    g.addColorStop(0.5, hexA(pt.color, life*0.28*strength));
    g.addColorStop(1, hexA(pt.color, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,r,0,Math.PI*2); ctx.fill();
  });
  ctx.restore();
}

/* ================= デザイン12種（2026年トレンド反映） ================= */
function seeded(seed){ let s=seed*9301+49297; return ()=>{ s=(s*9301+49297)%233280; return s/233280; }; }
function base(c,w,h,c1,c2){
  const g = c.createLinearGradient(0,-h/2,0,h/2);
  g.addColorStop(0,c1); g.addColorStop(1,c2);
  c.fillStyle=g; c.fillRect(-w/2,-h/2,w,h*1.2);
}
function nudeBase(c,w,h,a){
  const keep=c.globalAlpha; c.globalAlpha=keep*a;
  base(c,w,h,'#f0dcd1','#e5c7b8'); c.globalAlpha=keep;
}
function heart(c,x,y,s){
  c.save(); c.translate(x,y); c.scale(s,s);
  c.beginPath();
  c.moveTo(0,0.35);
  c.bezierCurveTo(-1.1,-0.5,-0.45,-1.2,0,-0.5);
  c.bezierCurveTo(0.45,-1.2,1.1,-0.5,0,0.35);
  c.closePath(); c.fill(); c.restore();
}
function flower(c,x,y,r,col){
  c.fillStyle=col;
  for(let i=0;i<5;i++){
    const a=i*Math.PI*2/5 - Math.PI/2;
    c.beginPath();
    c.ellipse(x+Math.cos(a)*r*0.72, y+Math.sin(a)*r*0.72, r*0.5, r*0.36, a, 0, Math.PI*2);
    c.fill();
  }
  c.fillStyle='#f3d98b';
  c.beginPath(); c.arc(x,y,r*0.3,0,Math.PI*2); c.fill();
}
const LOOKS = {

    c.globalAlpha=keep*.5;
    const g=c.createRadialGradient(0,h*0.05,0, 0,h*0.05,w*0.75);
    g.addColorStop(0,shade(col,-10)); g.addColorStop(1,'rgba(255,255,255,0)');
    c.fillStyle=g; c.fillRect(-w/2,-h/2,w,h*1.2);

    nudeBase(c,w,h,.35);
    const k=c.globalAlpha; c.globalAlpha=k*(0.25+v*0.60);
    base(c,w,h,shade(col,40),shade(col,10)); c.globalAlpha=k;
  }},
  frenchmirror:{name:'ミラーフレンチ', varLabel:'フレンチの幅', paint(c,w,h,col,seed,v){
    nudeBase(c,w,h,.5);
    const g=c.createLinearGradient(-w/2,0,w/2,0);
    g.addColorStop(0,shade(col,-28)); g.addColorStop(.28,shade(col,85));
    g.addColorStop(.55,shade(col,-6)); g.addColorStop(.78,shade(col,95)); g.addColorStop(1,shade(col,20));
    c.save();
    const e2=h*(0.25-v*0.24), m2=h*(0.64-v*0.56);
    c.beginPath(); c.moveTo(-w/2,-e2); c.quadraticCurveTo(0,-m2,w/2,-e2);
    c.lineTo(w/2,-h/2); c.lineTo(-w/2,-h/2); c.closePath(); c.clip();
    c.fillStyle=g; c.fillRect(-w/2,-h/2,w,h);
    c.restore();
  }},
  pearl:{name:'パール', paint(c,w,h,col){
    base(c,w,h,shade(col,48),shade(col,10));
    const g=c.createRadialGradient(-w*0.18,-h*0.22,0,-w*0.18,-h*0.22,w*0.95);
    g.addColorStop(0,'rgba(255,255,255,.7)');
    g.addColorStop(.55,'rgba(255,246,250,.25)');
    g.addColorStop(1,'rgba(255,255,255,0)');
    c.fillStyle=g; c.fillRect(-w/2,-h/2,w,h*1.2);
    const rnd=seeded(61);
    for(let i=0;i<26;i++){
      c.fillStyle='rgba(255,255,255,'+(0.22+rnd()*0.38).toFixed(2)+')';
      c.beginPath(); c.arc((rnd()-.5)*w,(rnd()-.5)*h,w*0.012+rnd()*w*0.010,0,Math.PI*2); c.fill();
    }
  }},
  stardust:{name:'スターダスト', varLabel:'ラメの量', paint(c,w,h,col,seed,v){
    nudeBase(c,w,h,.5);
    const g=c.createLinearGradient(0,h/2,0,-h/2);
    g.addColorStop(0,'rgba(255,255,255,0)');
    g.addColorStop(.5,hexA(shade(col,20),.55));
    g.addColorStop(1,shade(col,-4));
    c.fillStyle=g; c.fillRect(-w/2,-h/2,w,h*1.2);
    const rnd=seeded(53);
    const nS=Math.round(25+v*140);
    for(let i=0;i<nS;i++){
      const y=(rnd()-.5)*h*1.1;
      const t=(h/2-y)/h;
      if(rnd()>t*0.95+0.05) continue;
      c.fillStyle = rnd()>.5 ? 'rgba(255,255,255,.9)' : hexA(shade(col,75),.8);
      c.beginPath(); c.arc((rnd()-.5)*w, y, w*0.006+rnd()*w*0.015,0,Math.PI*2); c.fill();
    }
  }},
  matte:{name:'マット', flat:true, paint(c,w,h,col){
    c.fillStyle=shade(col,-4); c.fillRect(-w/2,-h/2,w,h*1.2);
    const k=c.globalAlpha; c.globalAlpha=k*.16;
    c.fillStyle='#efe7e0'; c.fillRect(-w/2,-h/2,w,h*1.2); c.globalAlpha=k;
  }},
  velvet:{name:'ベルベット', flat:true, paint(c,w,h,col){
    c.fillStyle=shade(col,-26); c.fillRect(-w/2,-h/2,w,h*1.2);
    const g=c.createRadialGradient(0,0,Math.min(w,h)*0.2,0,0,Math.max(w,h)*0.8);
    g.addColorStop(0,'rgba(255,255,255,0)');
    g.addColorStop(1,hexA(shade(col,55),.42));
    c.fillStyle=g; c.fillRect(-w/2,-h/2,w,h*1.2);
  }},
  marble:{name:'大理石', varLabel:'模様の量', paint(c,w,h,col,seed,v){
    base(c,w,h,shade(col,66),shade(col,40));
    const vein=(seed,color,wid,n)=>{
      const rnd=seeded(seed); c.strokeStyle=color; c.lineCap='round'; c.lineJoin='round';
      n=Math.max(1, Math.round(n*(0.4+v*1.2)));
      for(let i=0;i<n;i++){
        c.lineWidth=wid*(0.5+rnd());
        let x=(rnd()-.5)*w*1.2, y=-h*0.6;
        c.beginPath(); c.moveTo(x,y);
        for(let k2=0;k2<6;k2++){ x+=(rnd()-.5)*w*0.5; y+=h*0.22; c.lineTo(x,y); }
        c.stroke();
      }
    };
    vein(7,  hexA(shade(col,-55),.60), w*0.032, 3);
    vein(23, hexA(shade(col,-15),.40), w*0.018, 4);
    vein(41, 'rgba(200,168,106,.7)',   w*0.010, 2);
  }},
  nuance:{name:'ニュアンス', paint(c,w,h,col){
    base(c,w,h,shade(col,44),shade(col,14));
    const rnd=seeded(13);
    for(let i=0;i<3;i++){
      const x=(rnd()-.5)*w*0.8, y=(rnd()-.5)*h*0.8, r=w*(0.30+rnd()*0.35);
      const g=c.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,hexA(shade(col,-28),.55)); g.addColorStop(1,'rgba(255,255,255,0)');
      c.fillStyle=g; c.fillRect(-w/2,-h/2,w,h*1.2);
    }
    c.strokeStyle='rgba(214,178,102,.9)'; c.lineWidth=w*0.022; c.lineCap='round';
    c.beginPath(); c.moveTo(-w*0.30,h*0.06); c.quadraticCurveTo(0,-h*0.12,w*0.28,h*0.20); c.stroke();
  }},
  bekko:{name:'べっ甲', varLabel:'斑の大きさ', paint(c,w,h,col,seed,v){
    base(c,w,h,shade(col,52),shade(col,4));
    const rnd=seeded(7);
    for(let i=0;i<9;i++){
      const x=(rnd()-.5)*w, y=(rnd()-.5)*h, r=w*(0.13+rnd()*0.28)*(0.5+v);
      const g=c.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,hexA(shade(col,-72),.9));
      g.addColorStop(.6,hexA(shade(col,-45),.35));
      g.addColorStop(1,hexA(shade(col,-45),0));
      c.fillStyle=g; c.fillRect(-w/2,-h/2,w,h*1.2);
    }
    const k=c.globalAlpha; c.globalAlpha=k*.16;      /* べっ甲らしい飴色をひと匙 */
    base(c,w,h,'#e8bd74','#a9682a'); c.globalAlpha=k;
  }},
  check:{name:'チェック', varLabel:'チェックの細かさ', paint(c,w,h,col,seed,v){
    base(c,w,h,'#fdf7f0','#f4e8dc');
    const k=c.globalAlpha;
    const sx=w*(0.40-v*0.32), sy=h*(0.37-v*0.30), nn=Math.ceil(0.6/Math.max(0.08,(0.40-v*0.32)));
    c.globalAlpha=k*.45; c.fillStyle=shade(col,20);
    for(let i=-nn;i<=nn;i++){
      c.fillRect(i*sx-w*0.05,-h*0.6,w*0.10,h*1.2);
      c.fillRect(-w/2,i*sy-h*0.03,w,h*0.075);
    }
    c.globalAlpha=k*.85; c.fillStyle=shade(col,-16);
    for(let i=-nn;i<=nn;i++){
      c.fillRect(i*sx-w*0.010,-h*0.6,w*0.020,h*1.2);
      c.fillRect(-w/2,i*sy-h*0.006,w,h*0.013);
    }
    c.globalAlpha=k;
  }},
  line:{name:'ワイヤー', varLabel:'線の太さ', paint(c,w,h,col,seed,v){
    nudeBase(c,w,h,.75);
    const k=c.globalAlpha; c.globalAlpha=k*.5;
    base(c,w,h,shade(col,50),shade(col,26)); c.globalAlpha=k;
    c.strokeStyle='#d8b46a'; c.lineWidth=w*(0.008+v*0.028); c.lineCap='round';
    c.beginPath(); c.moveTo(-w*0.34,-h*0.24);
    c.bezierCurveTo(w*0.10,-h*0.05,-w*0.20,h*0.16,w*0.32,h*0.30); c.stroke();
    c.beginPath(); c.moveTo(-w*0.30,h*0.06);
    c.quadraticCurveTo(0,h*0.30,w*0.30,-h*0.02); c.stroke();
    c.fillStyle='#fff'; c.beginPath(); c.arc(w*0.10,-h*0.02,w*0.045,0,Math.PI*2); c.fill();
  }},
  shell:{name:'シェル', paint(c,w,h,col){
    base(c,w,h,shade(col,52),shade(col,20));
    const rnd=seeded(31);
    for(let i=0;i<16;i++){
      const x=(rnd()-.5)*w*0.95, y=(rnd()-.5)*h, r=w*(0.07+rnd()*0.14), a=rnd()*Math.PI;
      c.save(); c.translate(x,y); c.rotate(a);
      const g=c.createLinearGradient(-r,0,r,0);
      const pal=['#ffd9ea','#d7ecff','#e5ffe9','#fff2cf'][Math.floor(rnd()*4)];
      g.addColorStop(0,'rgba(255,255,255,.9)');
      g.addColorStop(.5,pal);
      g.addColorStop(1,'rgba(255,255,255,.25)');
      c.fillStyle=g; c.beginPath(); c.ellipse(0,0,r,r*0.6,0,0,Math.PI*2); c.fill();
      c.restore();
    }
  }},
};

/* ================= マイデザイン（自作を乗せる） ================= */
const customLooks = [];   // {name, img}
const DESIGN_KEY = 'tsuya.designs';
(function loadSavedDesigns(){
  let arr=[]; try{ arr=JSON.parse(localStorage.getItem(DESIGN_KEY)||'[]'); }catch(e){}
  arr.forEach(d=>{
    const img=new Image();
    img.onload=()=>{ try{ buildLooks(); }catch(e){} };
    img.src=d.data;
    customLooks.push({name:d.name, img});
  });
})();
/* 指ごとのデザイン（親指→小指）。targetFinger が -1 なら「すべて」 */
const FINGER_NAMES = ['親','人','中','薬','小'];
const nailLooks = ['onecolor','onecolor','onecolor','onecolor','onecolor'];
const nailColors = ['#b76e79','#b76e79','#b76e79','#b76e79','#b76e79'];
let targetFinger = -1;
/* 柄のつまみ：デザインごとに 0〜1 を憶える（既定 0.5 = 元の見た目） */
const lookVar = {};
const varOf = key => (key in lookVar) ? lookVar[key] : 0.5;

function paintLook(c,w,h,col,seed){ paintByKey(c,currentLook,w,h,col,seed); }
function paintByKey(c,key,w,h,col,seed){
  if(!key || (!LOOKS[key] && !key.startsWith('custom:'))) key='onecolor';
  if(key.startsWith('custom:')){
    const cl = customLooks[+key.slice(7)];
    if(cl) drawCover(c, cl.img, w, h);
    else base(c,w,h,shade(col,18),shade(col,-14));
    return;
  }
  LOOKS[key].paint(c,w,h,col,seed,varOf(key));
}
function activeLook(){ return targetFinger<0 ? nailLooks[2] : nailLooks[targetFinger]; }
function activeColor(){ return targetFinger<0 ? nailColors[2] : nailColors[targetFinger]; }
/* 色も「すべて」か指1本かで塗り分ける */
function setColor(col){
  if(targetFinger<0) nailColors.fill(col); else nailColors[targetFinger]=col;
  currentColor = col;
  refreshThumbs();
}
function setLook(key){
  if(targetFinger<0) nailLooks.fill(key); else nailLooks[targetFinger]=key;
  currentLook = key;
  markActiveLook(); buildFingerRow(); syncVarSlider(); markActiveChip();
}
function markActiveLook(){
  const cur = activeLook();
  $('looksRow').querySelectorAll('.look').forEach(d=>{
    if(d.dataset.key) d.classList.toggle('active', d.dataset.key===cur);
  });
}
function syncVarSlider(){
  const key = activeLook();
  const lk = LOOKS[key];
  if(lk && lk.varLabel){
    $('varRow').style.display='flex';
    $('varLabel').textContent = lk.varLabel;
    $('varSlider').value = Math.round(varOf(key)*100);
  }else{
    $('varRow').style.display='none';
  }
}
function onTargetChange(){
  currentLook = activeLook();
  currentColor = activeColor();
  buildFingerRow(); markActiveLook(); markActiveChip(); syncVarSlider();
}
/* 指セレクタ（小さな手）。デザインとカラーの両方のタブに出す */
function buildFingerRow(){
  ['fingerRow','fingerRow2'].forEach(rid=>{ const r=$(rid); if(r) buildFingerRowInto(r); });
}
function buildFingerRowInto(row){
  row.innerHTML='';
  const all=document.createElement('button');
  all.className='allbtn'+(targetFinger<0?' active':'');
  all.textContent='すべて';
  all.onclick=()=>{ targetFinger=-1; onTargetChange(); };
  row.appendChild(all);
  const lift=[0,9,12,10,4];
  FINGER_NAMES.forEach((nm,i)=>{
    const d=document.createElement('div');
    d.className='fingerbtn'+(targetFinger===i?' active':'');
    d.style.marginBottom=lift[i]+'px';
    const cv=document.createElement('canvas'); cv.width=52; cv.height=66;
    const c=cv.getContext('2d'); c.translate(26,33);
    c.save(); paintByKey(c,nailLooks[i],44,60,nailColors[i],i); c.restore();
    c.globalAlpha=.3; c.fillStyle='#fff';
    c.beginPath(); c.ellipse(-8,-12,7,12,-0.3,0,Math.PI*2); c.fill(); c.globalAlpha=1;
    d.appendChild(cv);
    const sp=document.createElement('span'); sp.textContent=nm; d.appendChild(sp);
    d.onclick=()=>{ targetFinger=i; onTargetChange(); };
    row.appendChild(d);
  });
}
function markActiveChip(){
  const box=$('chips'); if(!box) return;
  const cur=(activeColor()||'').toLowerCase();
  box.querySelectorAll('.chip').forEach(x=>{
    x.classList.toggle('active', (x.dataset.col||'').toLowerCase()===cur);
  });
  const pick=box.querySelector('input[type=color]');
  if(pick) pick.value = activeColor();
}
function drawCover(c,img,w,h){
  const H = h*1.2;
  const sc = Math.max(w/img.width, H/img.height);
  c.drawImage(img, -img.width*sc/2, -h/2 + (H-img.height*sc)/2, img.width*sc, img.height*sc);
}
function addCustomLook(img, name){
  customLooks.push({name: name || 'マイデザイン'+(customLooks.length+1), img});
  setLook('custom:' + (customLooks.length-1));
  buildLooks();
}
$('designInput').addEventListener('change', async e=>{
  const file=e.target.files[0]; if(!file) return;
  const img=await loadImage(file);
  addCustomLook(img, file.name.replace(/\.[^.]+$/,'').slice(0,8));
  e.target.value='';
});

/* ルックサムネ */
function buildLooks(){
  const row = $('looksRow');
  row.innerHTML='';
  const entries = [
    ...Object.entries(LOOKS),
    ...customLooks.map((cl,i)=>['custom:'+i, cl]),
  ];
  entries.forEach(([key,look])=>{
    const div=document.createElement('div');
    div.className='look'+(key===activeLook()?' active':'');
    div.dataset.key=key;
    const cv=document.createElement('canvas'); cv.width=104; cv.height=132;
    div.appendChild(cv);
    const sp=document.createElement('span'); sp.textContent=look.name; div.appendChild(sp);
    div.onclick=()=>{ setLook(key); refreshThumbs(); };
    row.appendChild(div);
  });
  const ICON_PEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 4.6 19.4 8.8"/><path d="M17.3 2.5a1.6 1.6 0 0 1 2.3 0l1.9 1.9a1.6 1.6 0 0 1 0 2.3L8.9 19.3l-5 1.8 1.8-5Z"/><path d="M4.4 20.7 8 17.1"/></svg>';
  const ICON_CAM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.4h3.3l1.4-2.2h8.6l1.4 2.2H21v10.2H3Z"/><circle cx="12" cy="13.2" r="3.5"/></svg>';
  [[ICON_PEN, ()=>openEditor()], [ICON_CAM, ()=>$('designInput').click()]].forEach(([icon,fn])=>{
    const div=document.createElement('div');
    div.className='look addtile';
    const box=document.createElement('div'); box.className='addbox'; box.innerHTML=icon;
    div.appendChild(box);
    const sp=document.createElement('span'); sp.textContent='マイデザイン'; div.appendChild(sp);
    div.onclick=fn;
    row.appendChild(div);
  });
  refreshThumbs();
}
function refreshThumbs(){
  const row=$('looksRow');
  [...row.children].forEach(div=>{
    const key=div.dataset.key; if(!key) return;
    const cv=div.querySelector('canvas'); const c=cv.getContext('2d');
    c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,104,132);
    c.translate(52,66);
    const w=88,hh=120;
    c.save();
    paintByKey(c,key,w,hh,currentColor,Object.keys(LOOKS).indexOf(key));
    c.globalAlpha=.35; c.fillStyle='#fff';
    c.beginPath(); c.ellipse(-w*0.18,-hh*0.2,w*0.15,hh*0.24,-0.3,0,Math.PI*2); c.fill();
    c.restore();
  });
  buildFingerRow();
}

/* ================= お絵かきエディタ ================= */
const ed = { canvas:null, ctx:null, drawing:false, size:14, tool:'pen', lx:0, ly:0, color:'#b76e79' };
function openEditor(){
  $('editor').style.display='flex';
  ed.color = currentColor;
  if(!ed.canvas){
    ed.canvas=$('edCanvas'); ed.ctx=ed.canvas.getContext('2d');
    const c=ed.ctx;
    edClear();
    const pos=ev=>{
      const r=ed.canvas.getBoundingClientRect();
      const p=ev.touches? ev.touches[0]: ev;
      return [(p.clientX-r.left)*ed.canvas.width/r.width, (p.clientY-r.top)*ed.canvas.height/r.height];
    };
    const start=ev=>{ ed.drawing=true; const [x,y]=pos(ev); stroke(x,y,true); ev.preventDefault(); };
    const move=ev=>{ if(!ed.drawing) return; const [x,y]=pos(ev); stroke(x,y,false); ev.preventDefault(); };
    const end=()=>{ ed.drawing=false; };
    function spray(x,y){
      const r = ed.size*1.25;
      const g = c.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0, hexA(ed.color,.16));
      g.addColorStop(.55, hexA(ed.color,.06));
      g.addColorStop(1, hexA(ed.color,0));
      c.fillStyle=g; c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fill();
    }
    function stroke(x,y,first){
      c.globalCompositeOperation = ed.tool==='erase' ? 'destination-out' : 'source-over';
      if(ed.tool==='air'){
        /* 点がとびとびに来るので、前の位置との間を埋める */
        if(first){ spray(x,y); }
        else{
          const d=Math.hypot(x-ed.lx, y-ed.ly);
          const n=Math.max(1, Math.ceil(d/Math.max(2, ed.size*0.28)));
          for(let i=1;i<=n;i++) spray(ed.lx+(x-ed.lx)*i/n, ed.ly+(y-ed.ly)*i/n);
        }
        ed.lx=x; ed.ly=y; return;
      }
      const lw = ed.tool==='fine' ? Math.max(1.6, ed.size*0.26) : ed.size;
      c.strokeStyle=ed.color; c.fillStyle=ed.color;
      c.lineWidth=lw; c.lineCap='round'; c.lineJoin='round';
      if(first){ c.beginPath(); c.arc(x,y,lw/2,0,Math.PI*2); c.fill(); c.beginPath(); c.moveTo(x,y); }
      else { c.lineTo(x,y); c.stroke(); }
      ed.lx=x; ed.ly=y;
    }
    ed.canvas.addEventListener('pointerdown',start);
    ed.canvas.addEventListener('pointermove',move);
    window.addEventListener('pointerup',end);
    $('edSize').addEventListener('input',e=>{ ed.size=+e.target.value; });
    const TOOLS={pen:'edPen', fine:'edFine', air:'edAir', erase:'edErase'};
    window.edSetTool = t=>{
      ed.tool=t;
      Object.entries(TOOLS).forEach(([k,id])=>$(id).classList.toggle('on', k===t));
    };
    Object.entries(TOOLS).forEach(([k,id])=>{ $(id).onclick=()=>edSetTool(k); });
    $('edClear').onclick=edClear;
    $('edCancel').onclick=()=>{ $('editor').style.display='none'; };
    $('edDone').onclick=()=>{
      const out=document.createElement('canvas');
      out.width=ed.canvas.width; out.height=ed.canvas.height;
      const oc=out.getContext('2d');
      const g=oc.createLinearGradient(0,0,0,out.height);
      g.addColorStop(0,'#f4e2d7'); g.addColorStop(1,'#eccfc0');
      oc.fillStyle=g; oc.fillRect(0,0,out.width,out.height);
      oc.drawImage(ed.canvas,0,0);
      addCustomLook(out);
      $('editor').style.display='none';
    };
  }
  const sw=$('edSwatches'); sw.innerHTML='';
  currentPalette.forEach(col=>{
    const s=document.createElement('div');
    s.className='edsw'; s.style.background=col;
    s.onclick=()=>{ ed.color=col; if(ed.tool==='erase') edSetTool('pen'); };
    sw.appendChild(s);
  });
}
function edClear(){ ed.ctx.clearRect(0,0,ed.canvas.width,ed.canvas.height); }

/* ================= カラー（トレンド色入り） ================= */
const defaultPalette=[
  '#b76e79', /* ローズ */        '#f3d98b', /* バターイエロー */
  '#f0bcc8', /* パステルピンク */ '#b9d2e4', /* パステルブルー */
  '#c47a5a', /* テラコッタ */     '#8b6a55', /* モカ */
  '#9d7a8c', /* モーヴ */        '#b23a48', /* クラシックレッド */
  '#cfe3d4', /* ミント */        '#c5b6dc', /* ラベンダー */
  '#e8c9ba', /* ヌード */        '#5d6a80', /* スモーキーブルー */
];
let currentPalette = [];
function renderChips(pal){
  currentPalette = pal;
  const box=$('chips'); box.innerHTML='';
  pal.forEach((col,i)=>{
    const el=document.createElement('div');
    el.className='chip'+(i===0?' active':'');
    el.style.background=`linear-gradient(145deg, ${col}, ${shade(col,-22)})`;
    el.dataset.col=col;
    el.onclick=()=>{ setColor(col); markActiveChip(); };
    box.appendChild(el);
  });
  const pick=document.createElement('input');
  pick.type='color'; pick.className='chip pick'; pick.value=currentColor;
  pick.addEventListener('input', e=>{
    setColor(e.target.value);
    box.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
    pick.classList.add('active');
  });
  box.appendChild(pick);
  /* 起動時と写真から配色したときは、従来どおり全部の指に1色目を入れる */
  if(pal.length){ nailColors.fill(pal[0]); currentColor = pal[0]; }
  markActiveChip();
  refreshThumbs();
}
$('inspoInput').addEventListener('change', async e=>{
  const file=e.target.files[0]; if(!file) return;
  const img=await loadImage(file);
  renderChips(extractPalette(img,12));
  $('note').textContent='この写真からもらった配色です。';
});
function extractPalette(img,n){
  const c=document.createElement('canvas'); const s=80; c.width=s;c.height=s;
  c.getContext('2d').drawImage(img,0,0,s,s);
  const d=c.getContext('2d').getImageData(0,0,s,s).data;
  const buckets={};
  for(let i=0;i<d.length;i+=4){
    const r=d[i],g=d[i+1],b=d[i+2];
    const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
    if(mx-mn<18&&(mx>230||mx<40)) continue;
    const k=`${r>>5}_${g>>5}_${b>>5}`;
    if(!buckets[k])buckets[k]={r:0,g:0,b:0,c:0};
    buckets[k].r+=r;buckets[k].g+=g;buckets[k].b+=b;buckets[k].c++;
  }
  return Object.values(buckets).sort((a,b)=>b.c-a.c).slice(0,n)
    .map(x=>rgb2hex(x.r/x.c,x.g/x.c,x.b/x.c));
}
/* ================= ユーティリティ ================= */
function rgb2hex(r,g,b){return '#'+[r,g,b].map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('')}
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  return rgb2hex((n>>16)+amt,(n>>8&255)+amt,(n&255)+amt);
}
function hexA(hex,a){
  const n=parseInt(hex.slice(1),16);
  return `rgba(${n>>16},${n>>8&255},${n&255},${a})`;
}
/* タブ */
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.tray').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    $('tray-'+t.dataset.t).classList.add('active');
  };
});
document.querySelectorAll('.presetrow').forEach(row=>{
  const key = row.dataset.key;
  row.querySelectorAll('.presetbtn').forEach(btn=>{
    btn.onclick = ()=>{
      row.querySelectorAll('.presetbtn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const raw = btn.dataset.val;
      tuneVals[key] = isNaN(+raw) ? raw : +raw;
    };
  });
});

if(window.__mpFailed) setStatus('AIモデルを読み込めませんでした。通信環境を確認して再読み込みしてください。');
/* ================= 組み合わせの保存 ================= */
const SETS_KEY='tsuya.sets';
function loadSets(){ try{ return JSON.parse(localStorage.getItem(SETS_KEY)||'[]'); }catch(e){ return []; } }
function storeSets(a){ try{ localStorage.setItem(SETS_KEY, JSON.stringify(a)); }catch(e){} }
function snapshotSet(name){
  return { name, looks:nailLooks.slice(), colors:nailColors.slice(), color:currentColor,
           tune:Object.assign({},tuneVals), vars:Object.assign({},lookVar) };
}
function withVars(vars, fn){
  const keep=Object.assign({},lookVar);
  Object.keys(lookVar).forEach(k=>delete lookVar[k]); Object.assign(lookVar, vars||{});
  try{ fn(); } finally {
    Object.keys(lookVar).forEach(k=>delete lookVar[k]); Object.assign(lookVar, keep);
  }
}
function applySet(st){
  st.looks.forEach((k,i)=>{
    nailLooks[i] = (k && (LOOKS[k] || k.indexOf('custom:')===0)) ? k : 'onecolor';
  });
  if(st.colors) st.colors.forEach((c,i)=>{ if(c) nailColors[i]=c; });
  else if(st.color) nailColors.fill(st.color);
  currentColor = activeColor();
  Object.assign(tuneVals, st.tune||{});
  Object.keys(lookVar).forEach(k=>delete lookVar[k]); Object.assign(lookVar, st.vars||{});
  document.querySelectorAll('.presetrow').forEach(row=>{
    const key=row.dataset.key;
    row.querySelectorAll('.presetbtn').forEach(b=>b.classList.toggle('active', String(tuneVals[key])===b.dataset.val));
  });
  if($('sculptLen')) $('sculptLen').value = tuneVals.sculptLen;
  currentLook = activeLook();
  buildLooks(); syncVarSlider(); markActiveChip();
}
function buildSetsRow(){
  const row=$('setsRow'); row.innerHTML='';
  const sets=loadSets();
  if(!sets.length){ row.style.display='none'; return; }
  row.style.display='flex';
  sets.forEach((st,idx)=>{
    const d=document.createElement('div'); d.className='setchip';
    const cv=document.createElement('canvas'); cv.width=110; cv.height=48;
    cv.style.width='55px'; cv.style.height='24px';
    const c=cv.getContext('2d');
    withVars(st.vars, ()=>{
      st.looks.forEach((k,i)=>{
        c.save(); c.translate(11+i*22, 24);
        c.beginPath(); c.rect(-8,-15,16,30); c.clip();
        paintByKey(c,k,16,26,(st.colors&&st.colors[i])||st.color||currentColor,i);
        c.restore();
      });
    });
    d.appendChild(cv);
    const sp=document.createElement('span'); sp.textContent=st.name; d.appendChild(sp);
    const del=document.createElement('div'); del.className='del'; del.textContent='×';
    del.onclick=ev=>{ ev.stopPropagation(); const a=loadSets(); a.splice(idx,1); storeSets(a); buildSetsRow(); };
    d.appendChild(del);
    d.onclick=()=>applySet(st);
    row.appendChild(d);
  });
}
$('saveSetLink').onclick=()=>{
  const name=(prompt('この組み合わせの名前は？','セット'+(loadSets().length+1))||'').trim();
  if(!name) return;
  const a=loadSets(); a.unshift(snapshotSet(name)); storeSets(a.slice(0,20)); buildSetsRow();
};
$('varSlider').addEventListener('input', e=>{
  lookVar[activeLook()] = +e.target.value/100;
  refreshThumbs();
});

buildLooks();
renderChips(defaultPalette);
buildTrailSwatches();
buildFingerRow();
syncVarSlider();
buildSetsRow();
</script>
