<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>艶 II — Hand &amp; Light Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #f7f4ef;
    --surface: #ffffff;
    --text-main: #1f1b18;
    --text-muted: #6e655f;
    --accent: #9e6443;
    --accent-glow: rgba(158, 100, 67, 0.18);
    --border: rgba(31, 27, 24, 0.08);
    --shadow-soft: 0 16px 40px -10px rgba(78, 54, 41, 0.09), 0 4px 12px rgba(0, 0, 0, 0.03);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--bg-primary);
    font-family: "Zen Kaku Gothic New", -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    color: var(--text-main);
  }

  /* タップ時の視覚フィードバック（作品本体と調和） */
  .tap-mark {
    position: fixed;
    z-index: 9999;
    left: 0;
    top: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.95);
    box-shadow: 0 0 0 1px rgba(35, 29, 25, 0.15), 0 2px 10px rgba(35, 29, 25, 0.15);
    pointer-events: none;
    transform: translate(-50%, -50%) scale(0.34);
    opacity: 0;
    animation: tap-mark-out 0.42s cubic-bezier(0.2, 0.72, 0.25, 1) forwards;
  }
  .tap-mark::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #d4a748;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.6);
    transform: translate(-50%, -50%);
  }
  @keyframes tap-mark-out {
    0% { opacity: 0.96; transform: translate(-50%, -50%) scale(0.34); }
    50% { opacity: 0.85; }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.18); }
  }

  /* 背景の静かで有機的な光彩 */
  .bg-ambient {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(55% 45% at 50% 32%, rgba(255, 255, 255, 0.95) 0%, rgba(247, 244, 239, 0.85) 60%, rgba(239, 233, 224, 0.9) 100%),
      radial-gradient(40% 40% at 50% 68%, rgba(214, 185, 160, 0.12) 0%, transparent 100%);
    z-index: 1;
  }

  /* 全体コンテナ */
  .container {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: calc(32px + env(safe-area-inset-top)) 24px calc(38px + env(safe-area-inset-bottom));
    text-align: center;
    max-width: 480px;
    margin: 0 auto;
  }

  /* 上部ヘッダー */
  .header-meta {
    opacity: 0;
    transform: translateY(-8px);
    animation: fadeInDown 0.9s var(--ease-out) 0.15s forwards;
  }
  .sub-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.22em;
    color: var(--text-muted);
    text-indent: 0.22em;
  }

  /* 中央：象徴カード */
  .stage-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    margin: auto 0;
  }

  .symbol-card {
    position: relative;
    width: 220px;
    height: 220px;
    border-radius: 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    text-decoration: none;
    opacity: 0;
    transform: scale(0.94) translateY(12px);
    animation: cardEntrance 1.1s var(--ease-out) 0.25s forwards;
    transition: transform 0.35s var(--ease-out), box-shadow 0.35s var(--ease-out), border-color 0.35s;
    outline: none;
  }
  .symbol-card:active {
    transform: scale(0.96);
    box-shadow: 0 8px 24px -6px rgba(78, 54, 41, 0.12);
  }
  .symbol-card:focus-visible {
    box-shadow: 0 0 0 3px var(--accent-glow), var(--shadow-soft);
  }

  /* 漢字「艶」 */
  .title-character {
    font-family: "Zen Old Mincho", serif;
    font-size: 110px;
    line-height: 1;
    font-weight: 500;
    color: var(--text-main);
    background: linear-gradient(135deg, #1f1b18 0%, #443730 45%, #9e6443 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    pointer-events: none;
  }

  /* 漢字を取り巻く繊細な光輪 */
  .sheen-glow {
    position: absolute;
    inset: -6px;
    border-radius: 34px;
    background: radial-gradient(circle at 50% 50%, var(--accent-glow), transparent 70%);
    opacity: 0.6;
    animation: breatheGlow 4s ease-in-out infinite alternate;
    pointer-events: none;
  }

  /* 下部アクションエリア */
  .bottom-action {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    width: 100%;
    opacity: 0;
    transform: translateY(12px);
    animation: fadeInUp 1s var(--ease-out) 0.45s forwards;
  }

  /* メインボタン */
  .btn-enter {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    max-width: 280px;
    height: 56px;
    border-radius: 999px;
    background: var(--accent);
    color: #ffffff;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-indent: 0.16em;
    text-decoration: none;
    border: none;
    cursor: pointer;
    box-shadow: 0 10px 24px -4px rgba(158, 100, 67, 0.35);
    transition: transform 0.2s var(--ease-out), box-shadow 0.2s, background-color 0.2s;
    outline: none;
  }
  .btn-enter:active {
    transform: scale(0.97);
    box-shadow: 0 4px 14px rgba(158, 100, 67, 0.35);
  }
  .btn-enter:focus-visible {
    box-shadow: 0 0 0 3px var(--accent-glow), 0 10px 24px -4px rgba(158, 100, 67, 0.35);
  }

  .btn-enter svg {
    width: 17px;
    height: 17px;
    stroke-width: 2.2;
    transition: transform 0.25s var(--ease-out);
    margin-right: -4px;
  }
  .btn-enter:hover svg {
    transform: translateX(3px);
  }

  /* 補助案内文 */
  .guide-caption {
    font-size: 12.5px;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin: 0;
  }

  /* トランジション用ヴェール */
  #veil {
    position: fixed;
    inset: 0;
    background: #f7f4ef;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
    z-index: 100;
  }

  /* アニメーション定義 */
  @keyframes fadeInDown {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeInUp {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes cardEntrance {
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes breatheGlow {
    from { opacity: 0.35; transform: scale(0.96); }
    to { opacity: 0.8; transform: scale(1.04); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, .symbol-card, .header-meta, .bottom-action, .sheen-glow {
      animation: none !important;
      transition: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
  }
</style>
</head>
<body>

<div class="bg-ambient"></div>

<main class="container">
  <div class="header-meta">
    <span class="sub-tag">HAND &amp; LIGHT ATELIER</span>
  </div>

  <div class="stage-center">
    <a href="../experience-prototype/?v=mobile69" class="symbol-card" id="symbolCard" aria-label="艶 II の作品へ進む">
      <div class="sheen-glow"></div>
      <h1 class="title-character">艶</h1>
    </a>
  </div>

  <div class="bottom-action">
    <a href="../experience-prototype/?v=mobile69" class="btn-enter" id="enterBtn" aria-label="作品を開く">
      <span>作品を開く</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </a>
    <p class="guide-caption">触れて作品世界へ進みます</p>
  </div>
</main>

<div id="veil"></div>

<script>
(() => {
  const enterBtn = document.getElementById('enterBtn');
  const symbolCard = document.getElementById('symbolCard');
  const veil = document.getElementById('veil');
  let navigating = false;

  // 画面遷移演出（フェード）
  function navigate(url) {
    if (navigating) return;
    navigating = true;
    veil.style.opacity = '1';
    setTimeout(() => {
      window.location.href = url;
    }, 380);
  }

  function handleInteraction(event, targetElement) {
    // 修飾キー（新規タブ等）は標準ブラウザ動作を維持
    if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
      return;
    }
    event.preventDefault();
    navigate(targetElement.getAttribute('href'));
  }

  symbolCard.addEventListener('click', (e) => handleInteraction(e, symbolCard));
  enterBtn.addEventListener('click', (e) => handleInteraction(e, enterBtn));

  // キーボードアクセシビリティ
  [symbolCard, enterBtn].forEach(el => {
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        navigate(el.getAttribute('href'));
      }
    });
  });

  // タップ位置フィードバック（アプリ本体と統一された金点・白リング）
  document.addEventListener('pointerdown', (event) => {
    if (event.isPrimary === false) return;
    const mark = document.createElement('span');
    mark.className = 'tap-mark';
    mark.style.left = event.clientX + 'px';
    mark.style.top = event.clientY + 'px';
    document.body.appendChild(mark);
    mark.addEventListener('animationend', () => mark.remove(), { once: true });
    setTimeout(() => mark.remove(), 600);
  }, { capture: true, passive: true });
})();
</script>
</body>
</html>
